
# ===================================
# SERVER CONFIGURATION
# ===================================
server.port=8080

# ===================================
# DATABASE CONFIGURATION
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/hotpot_db
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / HIBERNATE CONFIGURATION
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================
# THYMELEAF CONFIGURATION
# ===================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===================================
# JWT CONFIGURATION
# ===================================
jwt.secret=hotpot_super_secret_key_2024_do_not_share
jwt.expiration=86400000

# ===================================
# EMAIL CONFIGURATION
# ===================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=yourteamemail@gmail.com
spring.mail.password=yourgmailapppassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===================================
# SWAGGER CONFIGURATION
# ===================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===================================
# FILE UPLOAD CONFIGURATION
# ===================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===================================
# LOGGING CONFIGURATION
# ===================================
logging.level.org.springframework=INFO
logging.level.com.hotpot=DEBUG
logging.level.org.hibernate.SQL=DEBUG
