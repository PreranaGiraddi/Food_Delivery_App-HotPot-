<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotPot - Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .navbar-brand { color:#ff6b35 !important; font-size:1.8rem; font-weight:700; }
        .btn-hotpot { background-color:#ff6b35; color:white; border:none; border-radius:25px; padding:8px 20px; }
        .btn-hotpot:hover { background-color:#e55a25; color:white; }
        .menu-card { border:none; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.08); transition:transform 0.3s; }
        .menu-card:hover { transform:translateY(-3px); }
        .badge-veg { background-color:#28a745; }
        .badge-nonveg { background-color:#dc3545; }
        .filter-btn { border-radius:25px; border:2px solid #ff6b35; color:#ff6b35; background:white; padding:6px 18px; margin:3px; }
        .filter-btn.active, .filter-btn:hover { background:#ff6b35; color:white; }
        .price-tag { color:#ff6b35; font-size:1.2rem; font-weight:700; }
        .old-price { text-decoration:line-through; color:#aaa; font-size:0.9rem; }
        .qty-control { display:flex; align-items:center; gap:8px; }
        .qty-btn { width:30px; height:30px; border-radius:50%; border:2px solid #ff6b35; background:white; color:#ff6b35; font-weight:700; cursor:pointer; }
        .qty-btn:hover { background:#ff6b35; color:white; }
        .cart-float { position:fixed; bottom:20px; right:20px; z-index:999; }
        footer { background-color:#2d2d2d; color:#aaa; }
    </style>
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">🍲 HotPot</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="restaurants.html"><i class="bi bi-arrow-left"></i> Restaurants</a></li>
                <li class="nav-item d-none" id="cartNav">
                    <a class="nav-link" href="cart.html">
                        <i class="bi bi-cart3"></i> Cart
                        <span class="badge bg-danger rounded-pill" id="cartCount">0</span>
                    </a>
                </li>
                <li class="nav-item d-none" id="ordersNav"><a class="nav-link" href="orders.html"><i class="bi bi-bag-check"></i> My Orders</a></li>
                <li class="nav-item d-none" id="userNav"><span class="nav-link fw-bold text-warning" id="userName"></span></li>
                <li class="nav-item" id="loginNav"><a class="nav-link" href="login.html">Login</a></li>
                <li class="nav-item d-none" id="logoutNav"><button class="btn btn-outline-danger ms-2" onclick="logout()">Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<!-- RESTAURANT HEADER -->
<div style="background:linear-gradient(135deg,#ff6b35,#f7c59f); padding:30px 0;">
    <div class="container text-white">
        <h2 class="fw-bold" id="restaurantTitle">🍽️ Loading...</h2>
        <p class="mb-0" id="restaurantSubtitle">Browse our delicious menu</p>
    </div>
</div>

<!-- FILTER BUTTONS -->
<div class="container mt-4">
    <div class="d-flex flex-wrap align-items-center gap-2">
        <span class="fw-bold me-2">Filter:</span>
        <button class="filter-btn active" onclick="filterMenu('ALL', this)">All</button>
        <button class="filter-btn" onclick="filterMenu('VEG', this)">🌿 Veg</button>
        <button class="filter-btn" onclick="filterMenu('NONVEG', this)">🍗 Non-Veg</button>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="container py-4">

    <div id="alertBox" class="alert d-none"></div>

    <!-- Loading -->
    <div id="loadingSection" class="text-center py-5">
        <div class="spinner-border text-warning" style="width:3rem;height:3rem;"></div>
        <p class="mt-3 text-muted">Loading menu...</p>
    </div>

    <!-- No results -->
    <div id="noResults" class="text-center py-5 d-none">
        <div style="font-size:4rem">🍽️</div>
        <h5 class="text-muted mt-3">No items found!</h5>
    </div>

    <!-- Menu Grid -->
    <div class="row g-4" id="menuGrid"></div>
</div>

<!-- FLOATING CART BUTTON -->
<div class="cart-float d-none" id="cartFloat">
    <a href="cart.html" class="btn btn-hotpot btn-lg shadow">
        <i class="bi bi-cart3"></i> View Cart
        <span class="badge bg-white text-danger ms-1" id="cartFloatCount">0</span>
    </a>
</div>

<!-- FOOTER -->
<footer class="py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">🍲 <strong class="text-white">HotPot</strong> © 2024</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = 'http://localhost:8080';
    let allMenuItems = [];
    let cartItemCount = 0;

    window.onload = function () {
        updateNavbar();

        const restaurantId   = localStorage.getItem('selectedRestaurantId');
        const restaurantName = localStorage.getItem('selectedRestaurantName');

        if (!restaurantId) {
            window.location.href = 'restaurants.html';
            return;
        }

        document.getElementById('restaurantTitle').textContent = '🍽️ ' + restaurantName;
        loadMenu(restaurantId);
    }

    function updateNavbar() {
        const token = localStorage.getItem('token');
        const name  = localStorage.getItem('userName');
        if (token) {
            document.getElementById('loginNav').classList.add('d-none');
            document.getElementById('cartNav').classList.remove('d-none');
            document.getElementById('ordersNav').classList.remove('d-none');
            document.getElementById('userNav').classList.remove('d-none');
            document.getElementById('logoutNav').classList.remove('d-none');
            document.getElementById('userName').textContent = '👤 ' + name;
            document.getElementById('cartFloat').classList.remove('d-none');
        }
    }

    async function loadMenu(restaurantId) {
        try {
            const response = await fetch(`${API}/api/menu/available/${restaurantId}`);
            const data = await response.json();
            allMenuItems = data;
            displayMenu(data);
        } catch (error) {
            showAlert('danger', 'Cannot load menu!');
        } finally {
            document.getElementById('loadingSection').classList.add('d-none');
        }
    }

    function filterMenu(type, btn) {
        // Update active button
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (type === 'ALL') {
            displayMenu(allMenuItems);
        } else {
            const filtered = allMenuItems.filter(item => item.dietaryType === type);
            displayMenu(filtered);
        }
    }

    function displayMenu(items) {
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = '';

        if (!items || items.length === 0) {
            document.getElementById('noResults').classList.remove('d-none');
            return;
        }

        document.getElementById('noResults').classList.add('d-none');

        items.forEach(item => {
            const isVeg     = item.dietaryType === 'VEG';
            const discount  = item.discountPrice && item.discountPrice < item.price;
            const col       = document.createElement('div');
            col.className   = 'col-md-4 col-sm-6';
            col.innerHTML = `
                <div class="card menu-card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6 class="card-title fw-bold mb-0">${item.name}</h6>
                            <span class="badge ${isVeg ? 'badge-veg' : 'badge-nonveg'} ms-2">
                                ${isVeg ? '🌿 Veg' : '🍗 Non-Veg'}
                            </span>
                        </div>
                        <p class="text-muted small mb-2">
                            ${item.description || 'Delicious item!'}
                        </p>
                        <p class="text-muted small mb-1">
                            <i class="bi bi-clock"></i> ${item.cookingTime || 15} mins
                            &nbsp;|&nbsp;
                            <i class="bi bi-fire"></i> ${item.tasteInfo || 'Regular'}
                        </p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div>
                                <span class="price-tag">
                                    ₹${discount ? item.discountPrice : item.price}
                                </span>
                                ${discount ? `<span class="old-price ms-1">₹${item.price}</span>` : ''}
                            </div>
                            <button class="btn btn-hotpot btn-sm"
                                    onclick="addToCart(${item.id}, '${item.name}', ${item.discountPrice || item.price})"
                                    id="addBtn_${item.id}">
                                <i class="bi bi-cart-plus"></i> Add
                            </button>
                        </div>
                    </div>
                </div>`;
            grid.appendChild(col);
        });
    }

    async function addToCart(menuItemId, itemName, price) {
        const token  = localStorage.getItem('token');
        const userId = localStorage.getItem('userId');

        if (!token || !userId) {
            showAlert('warning', 'Please login to add items to cart!');
            setTimeout(() => window.location.href = 'login.html', 1500);
            return;
        }

        // ✅ Check if user is adding from different restaurant
        const currentRestaurantId   = localStorage.getItem('selectedRestaurantId');
        const currentRestaurantName = localStorage.getItem('selectedRestaurantName');
        const cartRestaurantId      = localStorage.getItem('cartRestaurantId');
        const cartRestaurantName    = localStorage.getItem('cartRestaurantName');

        // ✅ If cart already has items from a DIFFERENT restaurant
        if (cartRestaurantId && cartRestaurantId !== currentRestaurantId) {
            const confirmClear = confirm(
                `⚠️ Your cart has items from "${cartRestaurantName}"!\n\n` +
                `Do you want to clear cart and order from "${currentRestaurantName}" instead?\n\n` +
                `Click OK to clear cart and add this item.\n` +
                `Click Cancel to keep current cart.`
            );

            if (confirmClear) {
                // ✅ Clear cart first then add new item
                await clearCartAndAdd(userId, token, menuItemId,
                                      itemName, currentRestaurantId,
                                      currentRestaurantName);
            } else {
                showAlert('warning',
                    `Your cart has items from "${cartRestaurantName}". ` +
                    `Clear cart first to order from "${currentRestaurantName}"!`);
            }
            return;
        }

        // ✅ Normal add to cart
        await doAddToCart(userId, token, menuItemId, itemName,
                          currentRestaurantId, currentRestaurantName);
    }

    // ✅ Clear cart then add new item
    async function clearCartAndAdd(userId, token, menuItemId, itemName,
                                    restaurantId, restaurantName) {
        try {
            // Clear cart first
            const clearResponse = await fetch(`${API}/api/cart/clear/${userId}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (clearResponse.ok) {
                // Remove old restaurant from localStorage
                localStorage.removeItem('cartRestaurantId');
                localStorage.removeItem('cartRestaurantName');

                // Now add new item
                await doAddToCart(userId, token, menuItemId, itemName,
                                  restaurantId, restaurantName);
            } else {
                showAlert('danger', 'Failed to clear cart!');
            }
        } catch (error) {
            showAlert('danger', 'Server error!');
        }
    }

    // ✅ Actual add to cart API call
    async function doAddToCart(userId, token, menuItemId, itemName,
                                restaurantId, restaurantName) {
        const btn = document.getElementById(`addBtn_${menuItemId}`);
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

        try {
            const response = await fetch(
                `${API}/api/cart/add?userId=${userId}&menuItemId=${menuItemId}&quantity=1`,
                {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                }
            );

            if (response.ok) {
                // ✅ Save which restaurant items are from
                localStorage.setItem('cartRestaurantId',   restaurantId);
                localStorage.setItem('cartRestaurantName', restaurantName);

                cartItemCount++;
                document.getElementById('cartCount').textContent      = cartItemCount;
                document.getElementById('cartFloatCount').textContent = cartItemCount;

                showAlert('success', `✅ ${itemName} added to cart!`);
                btn.innerHTML      = '<i class="bi bi-check"></i> Added';
                btn.style.background = '#28a745';

                setTimeout(() => {
                    btn.disabled       = false;
                    btn.innerHTML      = '<i class="bi bi-cart-plus"></i> Add';
                    btn.style.background = '#ff6b35';
                }, 2000);

            } else {
                const err = await response.json();
                showAlert('danger', err.message || 'Failed to add item!');
                btn.disabled  = false;
                btn.innerHTML = '<i class="bi bi-cart-plus"></i> Add';
            }
        } catch (error) {
            showAlert('danger', 'Server error!');
            btn.disabled  = false;
            btn.innerHTML = '<i class="bi bi-cart-plus"></i> Add';
        }
    }
    function showAlert(type, msg) {
        const el = document.getElementById('alertBox');
        el.className = `alert alert-${type}`;
        el.textContent = msg;
        el.classList.remove('d-none');
        setTimeout(() => el.classList.add('d-none'), 3000);
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
