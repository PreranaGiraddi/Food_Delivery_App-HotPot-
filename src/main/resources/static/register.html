<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotPot - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire: #ff6b35;
            --fire-dark: #e04e1a;
            --dark: #1a1008;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(135deg, rgba(26,16,8,0.92) 0%, rgba(61,32,16,0.80) 100%),
                url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1400&q=80') center/cover no-repeat fixed;
            padding: 2rem 1rem;
        }

        /* CARD */
        .register-card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.35);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        /* CARD TOP */
        .card-top {
            background: var(--dark);
            padding: 2rem 2rem 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card-top::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 150px; height: 150px;
            background: rgba(255,107,53,0.08);
            border-radius: 50%;
        }
        .card-top::after {
            content: '';
            position: absolute;
            bottom: -30px; left: -30px;
            width: 100px; height: 100px;
            background: rgba(255,107,53,0.06);
            border-radius: 50%;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--fire);
            display: block;
            margin-bottom: 4px;
            position: relative; z-index: 1;
        }
        .brand span { color: #fff; }

        .card-top h4 {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            color: rgba(255,255,255,0.7);
            font-weight: 400;
            position: relative; z-index: 1;
        }

        /* CARD BODY */
        .card-body-inner { padding: 2rem; }

        /* FORM FIELDS */
        .field-wrap {
            position: relative;
            margin-bottom: 1rem;
        }
        .field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #b09080;
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s;
        }
        .form-control {
            border: 1.5px solid #e8ddd5;
            border-radius: 12px;
            padding: 11px 14px 11px 40px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            color: var(--dark);
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fdfaf8;
        }
        .form-control::placeholder { color: #c0a898; }
        .form-control:focus {
            border-color: var(--fire);
            box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
            outline: none;
            background: #fff;
        }
        .form-control:focus + .field-icon,
        .field-wrap:focus-within .field-icon { color: var(--fire); }

        /* Swap icon position — icon after input in DOM but visually before */
        .field-wrap .form-control { order: 1; }
        .field-wrap .field-icon   { order: 0; }

        /* PASSWORD TOGGLE */
        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #b09080;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 0;
        }
        .toggle-pw:hover { color: var(--fire); }
        .pw-field { padding-right: 40px !important; }

        /* REGISTER BUTTON */
        .btn-register {
            background: linear-gradient(135deg, var(--fire), var(--fire-dark));
            color: white;
            border: none;
            border-radius: 50px;
            padding: 13px 0;
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(255,107,53,0.35);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.5rem;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(255,107,53,0.45);
            color: white;
        }
        .btn-register:active { transform: translateY(0); }
        .btn-register:disabled { opacity: 0.7; transform: none; cursor: not-allowed; }

        /* DIVIDER */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 1.2rem 0;
            color: #c0a898;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #f0e8e0;
        }

        /* LOGIN LINK */
        .login-row {
            text-align: center;
            font-size: 0.88rem;
            color: #9e8070;
        }
        .login-row a {
            color: var(--fire);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s;
        }
        .login-row a:hover { color: var(--fire-dark); text-decoration: underline; }

        /* ALERT */
        #errorAlert {
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 500;
            padding: 10px 14px;
            margin-bottom: 1rem;
            border: none;
            background: #ffebee;
            color: #b71c1c;
        }

        /* PERKS ROW */
        .perks {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.2rem;
        }
        .perk {
            text-align: center;
            font-size: 0.72rem;
            color: #9e8070;
            font-weight: 500;
        }
        .perk-icon { font-size: 1.3rem; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

<div class="register-card">

    <!-- TOP -->
    <div class="card-top">
        <span class="brand">🍲 Hot<span>Pot</span></span>
        <h4>Create your account</h4>
    </div>

    <!-- BODY -->
    <div class="card-body-inner">



        <div id="errorAlert" class="d-none"></div>

        <!-- Name -->
        <div class="field-wrap">
            <input type="text" id="name" class="form-control" placeholder="Full Name">
            <i class="bi bi-person field-icon"></i>
        </div>

        <!-- Email -->
        <div class="field-wrap">
            <input type="email" id="email" class="form-control" placeholder="Email Address">
            <i class="bi bi-envelope field-icon"></i>
        </div>

        <!-- Password -->
        <div class="field-wrap">
            <input type="password" id="password" class="form-control pw-field" placeholder="Password">
            <i class="bi bi-lock field-icon"></i>
            <button class="toggle-pw" type="button" onclick="togglePw()" id="toggleBtn">
                <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
        </div>

        <!-- Contact -->
        <div class="field-wrap">
            <input type="text" id="contactNumber" class="form-control" placeholder="Contact Number">
            <i class="bi bi-telephone field-icon"></i>
        </div>

        <!-- Address -->
        <div class="field-wrap">
            <input type="text" id="address" class="form-control" placeholder="Delivery Address">
            <i class="bi bi-geo-alt field-icon"></i>
        </div>

        <button class="btn-register" onclick="register()" id="registerBtn">
            <i class="bi bi-person-plus"></i> Create Account
        </button>

        <div class="divider">or</div>

        <div class="login-row">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>
</div>

<script>
    const API = "http://localhost:8080";

    function togglePw() {
        const pw  = document.getElementById('password');
        const eye = document.getElementById('eyeIcon');
        if (pw.type === 'password') {
            pw.type = 'text';
            eye.className = 'bi bi-eye-slash';
        } else {
            pw.type = 'password';
            eye.className = 'bi bi-eye';
        }
    }

    async function register() {
        const name          = document.getElementById("name").value.trim();
        const email         = document.getElementById("email").value.trim();
        const password      = document.getElementById("password").value;
        const contactNumber = document.getElementById("contactNumber").value.trim();
        const address       = document.getElementById("address").value.trim();
        const btn           = document.getElementById("registerBtn");
        const errorAlert    = document.getElementById("errorAlert");

        errorAlert.classList.add("d-none");

        if (!name || !email || !password || !contactNumber || !address) {
            errorAlert.classList.remove("d-none");
            errorAlert.innerText = "Please fill in all fields.";
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

        try {
            const response = await fetch(API + "/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, email, password, contactNumber, address })
            });

            const data = await response.json();

            if (response.ok) {
                btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Account Created!';
                btn.style.background = 'linear-gradient(135deg,#43a047,#2e7d32)';
                setTimeout(() => window.location.href = "login.html", 1000);
            } else {
                errorAlert.classList.remove("d-none");
                errorAlert.innerText = data.message || "Registration failed. Please try again.";
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Create Account';
            }
        } catch (error) {
            errorAlert.classList.remove("d-none");
            errorAlert.innerText = "Cannot connect to server. Please try again.";
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Create Account';
        }
    }

    
    document.addEventListener('keydown', e => { if (e.key === 'Enter') register(); });
</script>
</body>
</html>
