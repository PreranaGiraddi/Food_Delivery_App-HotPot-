<!DOCTYPE html>
<html>
<head>
    <title>HotPot - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="col-md-5 mx-auto card p-4 shadow">
        <h3 class="text-center mb-3">🍲 HotPot Register</h3>

        <div id="errorAlert" class="alert alert-danger d-none"></div>

        <input type="text" id="name" class="form-control mb-3" placeholder="Full Name">
        <input type="email" id="email" class="form-control mb-3" placeholder="Email">
        <input type="password" id="password" class="form-control mb-3" placeholder="Password">
        <input type="text" id="contactNumber" class="form-control mb-3" placeholder="Contact Number">
        <input type="text" id="address" class="form-control mb-3" placeholder="Address">

        <button class="btn btn-warning w-100" onclick="register()">Register</button>

        <p class="text-center mt-3">
            Already have account?
            <a href="login.html">Login</a>
        </p>
    </div>
</div>

<script>
    const API = "http://localhost:8080";

    async function register() {

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const contactNumber = document.getElementById("contactNumber").value;
        const address = document.getElementById("address").value;

        const response = await fetch(API + "/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name, email, password, contactNumber, address
            })
        });

        const data = await response.json();

        if (response.ok) {
            window.location.href = "login.html";
        } else {
            const errorAlert = document.getElementById("errorAlert");
            errorAlert.classList.remove("d-none");
            errorAlert.innerText = data.message;
        }
    }
</script>

</body>
</html>
