<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotPot | Admin — Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{--fire:#ff6b35;--fire-dark:#e85d2f;--coal:#1a1a2e;--cream:#faf7f2;--gold:#f5a623;--success:#2ecc71;--danger:#e74c3c;--info:#3498db;--purple:#9b59b6;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:var(--cream);display:flex;min-height:100vh;}
        .sidebar{width:240px;min-height:100vh;background:var(--coal);position:fixed;left:0;top:0;z-index:1000;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,0.25);}
        .sidebar-brand{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,0.07);}
        .brand-logo{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:var(--fire);}
        .brand-sub{font-size:0.62rem;color:rgba(255,255,255,0.3);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
        .admin-info{padding:14px 18px;background:rgba(231,76,60,0.08);border-bottom:1px solid rgba(255,255,255,0.05);}
        .admin-name{font-family:'Syne',sans-serif;font-weight:700;color:#fff;font-size:0.88rem;}
        .admin-badge{display:inline-block;background:#e74c3c;color:#fff;font-size:0.58rem;padding:2px 8px;border-radius:20px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:4px;}
        .sidebar-nav{padding:14px 10px;flex:1;}
        .nav-label{font-size:0.58rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.22);padding:8px 10px 5px;font-weight:600;}
        .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,0.5);cursor:pointer;transition:all 0.2s;margin-bottom:2px;font-size:0.87rem;font-weight:500;text-decoration:none;}
        .nav-item:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.82);}
        .nav-item.active{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;box-shadow:0 4px 14px rgba(231,76,60,0.3);}
        .nav-item i{font-size:1rem;width:18px;text-align:center;}
        .sidebar-footer{padding:14px 10px;border-top:1px solid rgba(255,255,255,0.07);}
        .logout-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:rgba(255,255,255,0.4);cursor:pointer;border:none;background:none;width:100%;font-size:0.85rem;transition:all 0.2s;}
        .logout-btn:hover{background:rgba(231,76,60,0.12);color:var(--danger);}
        .main-content{margin-left:240px;flex:1;}
        .top-bar{background:#fff;padding:15px 28px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.04);}
        .page-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;color:var(--coal);}
        .page-subtitle{font-size:0.77rem;color:#aaa;}
        .content-area{padding:24px 28px;}
        .content-card{background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;}
        .card-head{padding:18px 22px;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
        .card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:0.93rem;color:var(--coal);}
        .custom-table{width:100%;border-collapse:collapse;}
        .custom-table th{padding:11px 18px;background:#f9f9f9;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:#999;text-align:left;}
        .custom-table td{padding:13px 18px;border-bottom:1px solid #f5f5f5;font-size:0.85rem;color:var(--coal);vertical-align:middle;}
        .custom-table tr:last-child td{border-bottom:none;}
        .custom-table tr:hover td{background:#fafafa;}
        .badge-role{padding:3px 10px;border-radius:20px;font-size:0.7rem;font-weight:600;}
        .btn-fire{background:var(--fire);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-weight:600;font-size:0.84rem;transition:all 0.2s;cursor:pointer;}
        .btn-fire:hover{background:var(--fire-dark);color:#fff;}
        .btn-danger-sm{background:rgba(231,76,60,0.1);color:#e74c3c;border:none;border-radius:8px;padding:5px 12px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
        .btn-danger-sm:hover{background:#e74c3c;color:#fff;}
        .f-input{width:100%;background:#f8f8f8;border:1.5px solid #eee;border-radius:10px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--coal);outline:none;transition:all 0.2s;}
        .f-input:focus{border-color:var(--fire);background:#fff;}
        .f-label{font-size:0.73rem;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:6px;display:block;}
        .f-select{width:100%;background:#f8f8f8;border:1.5px solid #eee;border-radius:10px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--coal);outline:none;}
        .f-select:focus{border-color:var(--fire);}
        .modal-content{border-radius:18px;border:none;box-shadow:0 20px 60px rgba(0,0,0,0.15);}
        .modal-header{border-bottom:1px solid #f0f0f0;padding:20px 24px;}
        .modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:var(--coal);}
        .modal-body{padding:22px 24px;}
        .modal-footer{border-top:1px solid #f0f0f0;padding:16px 24px;}
        .search-bar{position:relative;min-width:220px;}
        .search-bar input{padding-left:36px;}
        .search-bar i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#bbb;font-size:0.9rem;}
        .filter-tabs{display:flex;gap:6px;flex-wrap:wrap;}
        .filter-tab{padding:6px 14px;border-radius:20px;font-size:0.78rem;font-weight:600;border:1.5px solid #eee;background:#fff;cursor:pointer;color:#999;transition:all 0.2s;}
        .filter-tab.active{background:var(--coal);color:#fff;border-color:var(--coal);}
        .loading-box{display:flex;align-items:center;justify-content:center;padding:36px;color:#ccc;gap:10px;font-size:0.86rem;}
        .empty-state{text-align:center;padding:40px 20px;color:#ccc;}
        .avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem;flex-shrink:0;}
        .alert-toast{position:fixed;top:20px;right:20px;z-index:9999;min-width:260px;border-radius:12px;padding:13px 17px;font-size:0.86rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.12);display:none;}
        .stat-pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #eee;border-radius:10px;padding:8px 16px;font-size:0.84rem;}
        .stat-pill strong{font-family:'Syne',sans-serif;font-size:1.1rem;color:var(--coal);}
        .modal-alert{background:rgba(231,76,60,0.08);border-left:3px solid #e74c3c;color:#c0392b;padding:10px 14px;border-radius:8px;font-size:0.84rem;margin-bottom:14px;display:none;}
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-logo">🍲 HotPot</div><div class="brand-sub">Admin Portal</div></div>
    <div class="admin-info"><div class="admin-name" id="sidebarAdminName">Administrator</div><span class="admin-badge">🛡️ Super Admin</span></div>
    <nav class="sidebar-nav">
        <div class="nav-label">Main</div>
        <a class="nav-item" href="admin-dashboard.html"><i class="bi bi-grid-fill"></i> Overview</a>
        <div class="nav-label mt-2">Manage</div>
        <a class="nav-item active" href="admin-users.html"><i class="bi bi-people-fill"></i> Users</a>
        <a class="nav-item" href="admin-restaurants.html"><i class="bi bi-shop"></i> Restaurants</a>
        <a class="nav-item" href="admin-menu.html"><i class="bi bi-egg-fried"></i> Menu & Categories</a>
    </nav>
    <div class="sidebar-footer"><button class="logout-btn" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</button></div>
</aside>
<div class="main-content">
    <div class="top-bar">
        <div><div class="page-title">User Management</div><div class="page-subtitle">Add, view and delete user accounts.</div></div>
        <button class="btn-fire" onclick="openAddModal()"><i class="bi bi-plus-lg me-1"></i> Add User</button>
    </div>
    <div class="alert-toast" id="alertToast"></div>
    <div class="content-area">
        <div class="d-flex gap-3 mb-4 flex-wrap">
            <div class="stat-pill"><strong id="cntAll">0</strong> Total</div>
            <div class="stat-pill" style="border-color:rgba(52,152,219,0.3)"><strong id="cntUser" style="color:var(--info)">0</strong> Customers</div>
            <div class="stat-pill" style="border-color:rgba(245,166,35,0.3)"><strong id="cntRest" style="color:var(--gold)">0</strong> Restaurants</div>
            <div class="stat-pill" style="border-color:rgba(231,76,60,0.3)"><strong id="cntAdmin" style="color:#e74c3c">0</strong> Admins</div>
        </div>
        <div class="content-card">
            <div class="card-head">
                <div class="search-bar"><i class="bi bi-search"></i><input type="text" class="f-input" id="searchInput" placeholder="Search name or email..." oninput="renderTable()"></div>
                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="setFilter('ALL',this)">All</button>
                    <button class="filter-tab" onclick="setFilter('USER',this)">Customer</button>
                    <button class="filter-tab" onclick="setFilter('RESTAURANT',this)">Restaurant</button>
                    <button class="filter-tab" onclick="setFilter('ADMIN',this)">Admin</button>
                </div>
            </div>
            <div id="tableWrap"><div class="loading-box"><div class="spinner-border spinner-border-sm text-secondary"></div> Loading users...</div></div>
        </div>
    </div>
</div>

<!-- ADD USER MODAL -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><div class="modal-title">➕ Add New User</div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="modal-alert" id="modalAlert"></div>
                <div class="mb-3"><label class="f-label">Full Name *</label><input type="text" class="f-input" id="addName" placeholder="John Doe"></div>
                <div class="mb-3"><label class="f-label">Email *</label><input type="email" class="f-input" id="addEmail" placeholder="john@example.com"></div>
                <div class="mb-3"><label class="f-label">Password *</label><input type="password" class="f-input" id="addPassword" placeholder="Min 6 characters"></div>
                <div class="mb-3"><label class="f-label">Mobile</label><input type="text" class="f-input" id="addMobile" placeholder="9876543210"></div>
                <div class="mb-3"><label class="f-label">Role *</label>
                    <select class="f-select" id="addRole">
                        <option value="ROLE_USER">Customer</option>
                        <option value="ROLE_RESTAURANT">Restaurant Owner</option>
                        <option value="ROLE_ADMIN">Admin</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn-fire" onclick="addUser()">Create User</button></div>
        </div>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-body text-center" style="padding:28px">
                <div style="font-size:2.5rem;margin-bottom:12px">🗑️</div>
                <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:var(--coal);margin-bottom:6px">Delete User?</div>
                <div style="font-size:0.84rem;color:#aaa;margin-bottom:20px" id="deleteUserName">This cannot be undone.</div>
                <div class="d-flex gap-2 justify-content-center"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" onclick="confirmDelete()">Delete</button></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API='http://localhost:8080';
const token=localStorage.getItem('token');
const role=localStorage.getItem('userRole')||'';
if(!token||!role.includes('ADMIN'))window.location.href='login.html';
document.getElementById('sidebarAdminName').textContent=localStorage.getItem('userName')||'Admin';
const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
let allUsers=[],filterRole='ALL',deleteId=null;

async function loadUsers(){
    try{
        const res=await fetch(`${API}/api/user/all`,{headers:H});
        if(!res.ok)throw new Error();
        allUsers=await res.json();
        updateCounts();renderTable();
    }catch{document.getElementById('tableWrap').innerHTML='<div class="empty-state">⚠️ Could not load users. Check API.</div>';}
}

function updateCounts(){
    document.getElementById('cntAll').textContent=allUsers.length;
    document.getElementById('cntUser').textContent=allUsers.filter(u=>{const r=(u.role||'').replace('ROLE_','');return r==='USER';}).length;
    document.getElementById('cntRest').textContent=allUsers.filter(u=>(u.role||'').includes('RESTAURANT')).length;
    document.getElementById('cntAdmin').textContent=allUsers.filter(u=>(u.role||'').includes('ADMIN')).length;
}

function setFilter(f,el){filterRole=f;document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderTable();}

function renderTable(){
    const q=document.getElementById('searchInput').value.toLowerCase();
    const filtered=allUsers.filter(u=>{
        const name=(u.name||u.userName||'').toLowerCase();
        const email=(u.email||'').toLowerCase();
        const r=(u.role||'').replace('ROLE_','');
        return(!q||name.includes(q)||email.includes(q))&&(filterRole==='ALL'||r===filterRole);
    });
    if(!filtered.length){document.getElementById('tableWrap').innerHTML='<div class="empty-state">No users found</div>';return;}
    let h=`<table class="custom-table"><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Mobile</th><th>Role</th><th>Action</th></tr></thead><tbody>`;
    filtered.forEach((u,i)=>{
        const r=(u.role||'USER').replace('ROLE_','');
        const c=r==='ADMIN'?'#e74c3c':r==='RESTAURANT'?'#b7860b':'#2980b9';
        const b=r==='ADMIN'?'rgba(231,76,60,0.1)':r==='RESTAURANT'?'rgba(245,166,35,0.1)':'rgba(52,152,219,0.1)';
        const ini=(u.name||u.userName||'U').slice(0,1).toUpperCase();
        h+=`<tr>
            <td style="color:#bbb;font-size:0.78rem">${i+1}</td>
            <td><div class="d-flex align-items-center gap-2"><div class="avatar" style="background:${b};color:${c}">${ini}</div><strong>${u.name||u.userName||'—'}</strong></div></td>
            <td style="color:#888">${u.email||'—'}</td>
            <td style="color:#888">${u.mobileNumber||u.mobile||'—'}</td>
            <td><span class="badge-role" style="background:${b};color:${c}">${r}</span></td>
            <td><button class="btn-danger-sm" onclick="openDelete(${u.id},'${(u.name||u.email||'this user').replace(/'/g,"\\'")}')"><i class="bi bi-trash3"></i> Delete</button></td>
        </tr>`;
    });
    h+='</tbody></table>';
    document.getElementById('tableWrap').innerHTML=h;
}

function openAddModal(){
    ['addName','addEmail','addPassword','addMobile'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('addRole').value='ROLE_USER';
    document.getElementById('modalAlert').style.display='none';
    new bootstrap.Modal(document.getElementById('addModal')).show();
}

async function addUser(){
    const name=document.getElementById('addName').value.trim();
    const email=document.getElementById('addEmail').value.trim();
    const password=document.getElementById('addPassword').value.trim();
    const mobile=document.getElementById('addMobile').value.trim();
    const role=document.getElementById('addRole').value;
    if(!name||!email||!password){showModalAlert('Please fill all required fields!');return;}
    try{
        const res=await fetch(`${API}/api/auth/register`,{method:'POST',headers:H,body:JSON.stringify({name,email,password,mobileNumber:mobile,role})});
        const data=await res.json();
        if(res.ok){bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();showToast('success','✅ User created!');loadUsers();}
        else{showModalAlert(data.message||'Failed to create user');}
    }catch{showModalAlert('Server error.');}
}

function openDelete(id,name){deleteId=id;document.getElementById('deleteUserName').textContent=`Delete "${name}"? This cannot be undone.`;new bootstrap.Modal(document.getElementById('deleteModal')).show();}

async function confirmDelete(){
    if(!deleteId)return;
    try{
        const res=await fetch(`${API}/api/user/delete/${deleteId}`,{method:'DELETE',headers:H});
        bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
        if(res.ok){showToast('success','✅ User deleted!');loadUsers();}
        else{showToast('danger','❌ Could not delete user');}
    }catch{showToast('danger','Server error');}
    deleteId=null;
}

function showModalAlert(msg){const el=document.getElementById('modalAlert');el.style.display='block';el.textContent=msg;}
function logout(){localStorage.clear();window.location.href='login.html';}
function showToast(type,msg){const t=document.getElementById('alertToast');const c={success:'#2ecc71',danger:'#e74c3c',warning:'#f5a623',info:'#3498db'};t.style.cssText=`display:block;background:#fff;border-left:4px solid ${c[type]};color:#333;position:fixed;top:20px;right:20px;z-index:9999;min-width:260px;border-radius:12px;padding:13px 17px;font-size:0.86rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.12)`;t.textContent=msg;setTimeout(()=>t.style.display='none',3500);}
loadUsers();
</script>
</body>
</html>
