<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotPot - Restaurants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .navbar-brand { color: #ff6b35 !important; font-size:1.8rem; font-weight:700; }
        .btn-hotpot { background-color:#ff6b35; color:white; border:none; border-radius:25px; padding:8px 20px; }
        .btn-hotpot:hover { background-color:#e55a25; color:white; }
        .restaurant-card { border:none; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.1); transition:transform 0.3s; cursor:pointer; }
        .restaurant-card:hover { transform:translateY(-5px); }
        .restaurant-card .card-img-top { height:180px; object-fit:cover; border-radius:15px 15px 0 0; font-size:5rem; display:flex; align-items:center; justify-content:center; background:#fff3e0; }
        .badge-veg { background-color:#28a745; }
        .search-bar { border-radius:25px; border:2px solid #ff6b35; padding:10px 20px; }
        .search-bar:focus { box-shadow:0 0 0 0.2rem rgba(255,107,53,0.25); border-color:#ff6b35; }
        footer { background-color:#2d2d2d; color:#aaa; }
        .spinner-section { min-height:300px; display:flex; align-items:center; justify-content:center; }
    </style>
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">🍲 HotPot</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="restaurants.html"><i class="bi bi-shop"></i> Restaurants</a></li>
                <li class="nav-item d-none" id="cartNav"><a class="nav-link" href="cart.html"><i class="bi bi-cart3"></i> Cart</a></li>
                <li class="nav-item d-none" id="ordersNav"><a class="nav-link" href="orders.html"><i class="bi bi-bag-check"></i> My Orders</a></li>
                <li class="nav-item d-none" id="userNav"><span class="nav-link fw-bold text-warning" id="userName"></span></li>
                <li class="nav-item" id="loginNav"><a class="nav-link" href="login.html"><i class="bi bi-box-arrow-in-right"></i> Login</a></li>
                <li class="nav-item d-none" id="logoutNav"><button class="btn btn-outline-danger ms-2" onclick="logout()">Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<!-- HEADER -->
<div style="background:linear-gradient(135deg,#ff6b35,#f7c59f); padding:40px 0;">
    <div class="container text-center text-white">
        <h2 class="fw-bold">🍽️ All Restaurants</h2>
        <p class="mb-3">Find your favourite restaurant and order now!</p>
        <!-- Search Bar -->
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control search-bar" id="searchInput"
                           placeholder="Search restaurants..." onkeyup="searchRestaurants()">
                    <button class="btn btn-dark ms-2" style="border-radius:25px;"
                            onclick="searchRestaurants()">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="container py-5">

    <!-- Alert -->
    <div id="alertBox" class="alert d-none"></div>

    <!-- Loading Spinner -->
    <div id="loadingSection" class="spinner-section">
        <div class="text-center">
            <div class="spinner-border text-warning" style="width:3rem;height:3rem;"></div>
            <p class="mt-3 text-muted">Loading restaurants...</p>
        </div>
    </div>

    <!-- No results -->
    <div id="noResults" class="text-center py-5 d-none">
        <div style="font-size:4rem">🍽️</div>
        <h5 class="text-muted mt-3">No restaurants found!</h5>
        <button class="btn btn-hotpot mt-3" onclick="loadRestaurants()">Show All</button>
    </div>

    <!-- Restaurants Grid -->
    <div class="row g-4" id="restaurantsGrid"></div>
</div>

<!-- FOOTER -->
<footer class="py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">🍲 <strong class="text-white">HotPot</strong> © 2024</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = 'http://localhost:8080';
    let allRestaurants = [];

    // ===== On Page Load =====
    window.onload = function () {
        updateNavbar();
        loadRestaurants();
    }

    // ===== Update Navbar based on login =====
    function updateNavbar() {
        const token = localStorage.getItem('token');
        const name  = localStorage.getItem('userName');
        if (token) {
            document.getElementById('loginNav').classList.add('d-none');
            document.getElementById('cartNav').classList.remove('d-none');
            document.getElementById('ordersNav').classList.remove('d-none');
            document.getElementById('userNav').classList.remove('d-none');
            document.getElementById('logoutNav').classList.remove('d-none');
            document.getElementById('userName').textContent = '👤 ' + name;
        }
    }

    // ===== Load All Active Restaurants =====
    async function loadRestaurants() {
        document.getElementById('loadingSection').classList.remove('d-none');
        document.getElementById('restaurantsGrid').innerHTML = '';
        document.getElementById('noResults').classList.add('d-none');

        try {
            const response = await fetch(`${API}/api/restaurant/active`);
            const data = await response.json();

            allRestaurants = data;
            displayRestaurants(data);

        } catch (error) {
            showAlert('danger', 'Cannot connect to server!');
        } finally {
            document.getElementById('loadingSection').classList.add('d-none');
        }
    }

    // ===== Search Restaurants =====
    async function searchRestaurants() {
        const keyword = document.getElementById('searchInput').value.trim();

        if (!keyword) {
            displayRestaurants(allRestaurants);
            return;
        }

        try {
            const response = await fetch(`${API}/api/restaurant/search?keyword=${keyword}`);
            const data = await response.json();
            displayRestaurants(data);
        } catch (error) {
            showAlert('danger', 'Search failed!');
        }
    }

    // ===== Display Restaurants =====
    function displayRestaurants(restaurants) {
        const grid = document.getElementById('restaurantsGrid');
        grid.innerHTML = '';

        if (!restaurants || restaurants.length === 0) {
            document.getElementById('noResults').classList.remove('d-none');
            return;
        }

        document.getElementById('noResults').classList.add('d-none');

        restaurants.forEach(r => {
            const col = document.createElement('div');
            col.className = 'col-md-4 col-sm-6';
            col.innerHTML = `
                <div class="card restaurant-card h-100"
                     onclick="goToMenu(${r.id}, '${r.name}')">
                    <div class="card-img-top text-center" style="font-size:5rem;
                         background:#fff3e0; padding:20px; border-radius:15px 15px 0 0;">
                        🍽️
                    </div>
                    <div class="card-body">
                        <h5 class="card-title fw-bold">${r.name}</h5>
                        <p class="text-muted small mb-1">
                            <i class="bi bi-geo-alt-fill text-danger"></i> ${r.location}
                        </p>
                        <p class="text-muted small mb-2">
                            <i class="bi bi-telephone-fill text-success"></i> ${r.contactNumber || 'N/A'}
                        </p>
                        <p class="card-text small text-muted">
                            ${r.description || 'Delicious food awaits!'}
                        </p>
                        <span class="badge bg-success">
                            <i class="bi bi-circle-fill" style="font-size:0.5rem"></i> Open
                        </span>
                    </div>
                    <div class="card-footer bg-white border-0 pb-3">
                        <button class="btn btn-hotpot w-100">
                            <i class="bi bi-menu-button-wide"></i> View Menu
                        </button>
                    </div>
                </div>`;
            grid.appendChild(col);
        });
    }

    // ===== Go to Menu Page =====
 function goToMenu(restaurantId, restaurantName) {
    localStorage.setItem('selectedRestaurantId',   String(restaurantId));
    localStorage.setItem('selectedRestaurantName', restaurantName);
    window.location.href = 'menu.html';
}
    function showAlert(type, msg) {
        const el = document.getElementById('alertBox');
        el.className = `alert alert-${type}`;
        el.textContent = msg;
        el.classList.remove('d-none');
        setTimeout(() => el.classList.add('d-none'), 3000);
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
