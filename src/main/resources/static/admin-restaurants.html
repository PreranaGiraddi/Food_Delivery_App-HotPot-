<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotPot | Admin — Restaurants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{--fire:#ff6b35;--fire-dark:#e85d2f;--coal:#1a1a2e;--cream:#faf7f2;--gold:#f5a623;--success:#2ecc71;--danger:#e74c3c;--info:#3498db;--purple:#9b59b6;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:var(--cream);display:flex;min-height:100vh;}
        .sidebar{width:240px;min-height:100vh;background:var(--coal);position:fixed;left:0;top:0;z-index:1000;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,0.25);}
        .sidebar-brand{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,0.07);}
        .brand-logo{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:var(--fire);}
        .brand-sub{font-size:0.62rem;color:rgba(255,255,255,0.3);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
        .admin-info{padding:14px 18px;background:rgba(231,76,60,0.08);border-bottom:1px solid rgba(255,255,255,0.05);}
        .admin-name{font-family:'Syne',sans-serif;font-weight:700;color:#fff;font-size:0.88rem;}
        .admin-badge{display:inline-block;background:#e74c3c;color:#fff;font-size:0.58rem;padding:2px 8px;border-radius:20px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:4px;}
        .sidebar-nav{padding:14px 10px;flex:1;}
        .nav-label{font-size:0.58rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.22);padding:8px 10px 5px;font-weight:600;}
        .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,0.5);cursor:pointer;transition:all 0.2s;margin-bottom:2px;font-size:0.87rem;font-weight:500;text-decoration:none;}
        .nav-item:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.82);}
        .nav-item.active{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;box-shadow:0 4px 14px rgba(231,76,60,0.3);}
        .nav-item i{font-size:1rem;width:18px;text-align:center;}
        .sidebar-footer{padding:14px 10px;border-top:1px solid rgba(255,255,255,0.07);}
        .logout-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:rgba(255,255,255,0.4);cursor:pointer;border:none;background:none;width:100%;font-size:0.85rem;transition:all 0.2s;}
        .logout-btn:hover{background:rgba(231,76,60,0.12);color:var(--danger);}
        .main-content{margin-left:240px;flex:1;}
        .top-bar{background:#fff;padding:15px 28px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.04);}
        .page-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;color:var(--coal);}
        .page-subtitle{font-size:0.77rem;color:#aaa;}
        .content-area{padding:24px 28px;}
        .content-card{background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;}
        .card-head{padding:18px 22px;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
        .card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:0.93rem;color:var(--coal);}
        .custom-table{width:100%;border-collapse:collapse;}
        .custom-table th{padding:11px 18px;background:#f9f9f9;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:#999;text-align:left;}
        .custom-table td{padding:13px 18px;border-bottom:1px solid #f5f5f5;font-size:0.85rem;color:var(--coal);vertical-align:middle;}
        .custom-table tr:last-child td{border-bottom:none;}
        .custom-table tr:hover td{background:#fafafa;}
        .badge-s{padding:4px 11px;border-radius:20px;font-size:0.72rem;font-weight:600;}
        .bs-open{background:rgba(46,204,113,0.12);color:#27ae60;} .bs-closed{background:rgba(231,76,60,0.1);color:#e74c3c;}
        .btn-fire{background:var(--fire);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-weight:600;font-size:0.84rem;transition:all 0.2s;cursor:pointer;}
        .btn-fire:hover{background:var(--fire-dark);color:#fff;}
        .btn-danger-sm{background:rgba(231,76,60,0.1);color:#e74c3c;border:none;border-radius:8px;padding:5px 12px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
        .btn-danger-sm:hover{background:#e74c3c;color:#fff;}
        .btn-edit-sm{background:rgba(52,152,219,0.1);color:var(--info);border:none;border-radius:8px;padding:5px 12px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.2s;margin-right:4px;}
        .btn-edit-sm:hover{background:var(--info);color:#fff;}
        .f-input{width:100%;background:#f8f8f8;border:1.5px solid #eee;border-radius:10px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--coal);outline:none;transition:all 0.2s;}
        .f-input:focus{border-color:var(--fire);background:#fff;}
        .f-label{font-size:0.73rem;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:6px;display:block;}
        .f-select{width:100%;background:#f8f8f8;border:1.5px solid #eee;border-radius:10px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--coal);outline:none;}
        .f-select:focus{border-color:var(--fire);}
        .modal-content{border-radius:18px;border:none;box-shadow:0 20px 60px rgba(0,0,0,0.15);}
        .modal-header{border-bottom:1px solid #f0f0f0;padding:20px 24px;}
        .modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:var(--coal);}
        .modal-body{padding:22px 24px;}
        .modal-footer{border-top:1px solid #f0f0f0;padding:16px 24px;}
        .search-bar{position:relative;min-width:220px;}
        .search-bar input{padding-left:36px;}
        .search-bar i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#bbb;font-size:0.9rem;}
        .loading-box{display:flex;align-items:center;justify-content:center;padding:36px;color:#ccc;gap:10px;font-size:0.86rem;}
        .empty-state{text-align:center;padding:40px 20px;color:#ccc;}
        .alert-toast{position:fixed;top:20px;right:20px;z-index:9999;min-width:260px;border-radius:12px;padding:13px 17px;font-size:0.86rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.12);display:none;}
        .stat-pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #eee;border-radius:10px;padding:8px 16px;font-size:0.84rem;}
        .stat-pill strong{font-family:'Syne',sans-serif;font-size:1.1rem;color:var(--coal);}
        .modal-alert{background:rgba(231,76,60,0.08);border-left:3px solid #e74c3c;color:#c0392b;padding:10px 14px;border-radius:8px;font-size:0.84rem;margin-bottom:14px;display:none;}
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-logo">🍲 HotPot</div><div class="brand-sub">Admin Portal</div></div>
    <div class="admin-info"><div class="admin-name" id="sidebarAdminName">Administrator</div><span class="admin-badge">🛡️ Super Admin</span></div>
    <nav class="sidebar-nav">
        <div class="nav-label">Main</div>
        <a class="nav-item" href="admin-dashboard.html"><i class="bi bi-grid-fill"></i> Overview</a>
        <div class="nav-label mt-2">Manage</div>
        <a class="nav-item" href="admin-users.html"><i class="bi bi-people-fill"></i> Users</a>
        <a class="nav-item active" href="admin-restaurants.html"><i class="bi bi-shop"></i> Restaurants</a>
        <a class="nav-item" href="admin-menu.html"><i class="bi bi-egg-fried"></i> Menu & Categories</a>
    </nav>
    <div class="sidebar-footer"><button class="logout-btn" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</button></div>
</aside>
<div class="main-content">
    <div class="top-bar">
        <div><div class="page-title">Restaurant Management</div><div class="page-subtitle">View and manage all restaurant accounts.</div></div>
        <button class="btn-fire" onclick="openAddModal()"><i class="bi bi-plus-lg me-1"></i> Add Restaurant</button>
    </div>
    <div class="alert-toast" id="alertToast"></div>
    <div class="content-area">
        <div class="d-flex gap-3 mb-4 flex-wrap">
            <div class="stat-pill"><strong id="cntAll">0</strong> Total</div>
            <div class="stat-pill" style="border-color:rgba(46,204,113,0.3)"><strong id="cntOpen" style="color:#27ae60">0</strong> Open</div>
            <div class="stat-pill" style="border-color:rgba(231,76,60,0.3)"><strong id="cntClosed" style="color:#e74c3c">0</strong> Closed</div>
        </div>
        <div class="content-card">
            <div class="card-head">
                <div class="search-bar"><i class="bi bi-search"></i><input type="text" class="f-input" id="searchInput" placeholder="Search restaurant or cuisine..." oninput="renderTable()"></div>
            </div>
            <div id="tableWrap"><div class="loading-box"><div class="spinner-border spinner-border-sm text-secondary"></div> Loading...</div></div>
        </div>
    </div>
</div>

<!-- ADD RESTAURANT MODAL -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header"><div class="modal-title">🍽️ Add New Restaurant</div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="modal-alert" id="modalAlert"></div>
                <div class="row g-3">
                    <div class="col-md-6"><label class="f-label">Restaurant Name *</label><input type="text" class="f-input" id="addName" placeholder="Spice Garden"></div>
                    <div class="col-md-6"><label class="f-label">Cuisine Type *</label><input type="text" class="f-input" id="addCuisine" placeholder="Indian, Chinese..."></div>
                    <div class="col-12"><label class="f-label">Description</label><input type="text" class="f-input" id="addDesc" placeholder="Short description of the restaurant"></div>
                    <div class="col-md-6"><label class="f-label">Address *</label><input type="text" class="f-input" id="addAddress" placeholder="123 Main St, City"></div>
                    <div class="col-md-6"><label class="f-label">Contact Number</label><input type="text" class="f-input" id="addContact" placeholder="9876543210"></div>
                    <div class="col-md-6"><label class="f-label">Opening Time</label><input type="text" class="f-input" id="addOpenTime" placeholder="09:00 AM"></div>
                    <div class="col-md-6"><label class="f-label">Closing Time</label><input type="text" class="f-input" id="addCloseTime" placeholder="11:00 PM"></div>
                    <div class="col-md-6">
                        <label class="f-label">Owner User ID (optional)</label>
                        <select class="f-select" id="addOwner"><option value="">-- Select Owner --</option></select>
                    </div>
                    <div class="col-md-6"><label class="f-label">Status</label>
                        <select class="f-select" id="addOpen"><option value="true">Open</option><option value="false">Closed</option></select>
                    </div>
                </div>
            </div>
            <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn-fire" onclick="addRestaurant()">Create Restaurant</button></div>
        </div>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-body text-center" style="padding:28px">
                <div style="font-size:2.5rem;margin-bottom:12px">🗑️</div>
                <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:var(--coal);margin-bottom:6px">Delete Restaurant?</div>
                <div style="font-size:0.84rem;color:#aaa;margin-bottom:20px" id="deleteRestName">This cannot be undone.</div>
                <div class="d-flex gap-2 justify-content-center"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" onclick="confirmDelete()">Delete</button></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API='http://localhost:8080';
const token=localStorage.getItem('token');
const role=localStorage.getItem('userRole')||'';
if(!token||!role.includes('ADMIN'))window.location.href='login.html';
document.getElementById('sidebarAdminName').textContent=localStorage.getItem('userName')||'Admin';
const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
let allRests=[],deleteId=null;

async function loadRestaurants(){
    try{
        const res=await fetch(`${API}/api/restaurant/all`,{headers:H});
        if(!res.ok)throw new Error();
        allRests=await res.json();
        updateCounts();renderTable();
    }catch{document.getElementById('tableWrap').innerHTML='<div class="empty-state">⚠️ Could not load restaurants.</div>';}
}

function updateCounts(){
    document.getElementById('cntAll').textContent=allRests.length;
    document.getElementById('cntOpen').textContent=allRests.filter(r=>r.open!==false).length;
    document.getElementById('cntClosed').textContent=allRests.filter(r=>r.open===false).length;
}

function renderTable(){
    const q=document.getElementById('searchInput').value.toLowerCase();
    const filtered=allRests.filter(r=>{
        const name=(r.name||'').toLowerCase();
        const cuisine=(r.cuisineType||r.cuisine||'').toLowerCase();
        return!q||name.includes(q)||cuisine.includes(q);
    });
    if(!filtered.length){document.getElementById('tableWrap').innerHTML='<div class="empty-state">No restaurants found</div>';return;}
    let h=`<table class="custom-table"><thead><tr><th>#</th><th>Restaurant</th><th>Cuisine</th><th>Address</th><th>Contact</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;
    filtered.forEach((r,i)=>{
        const open=r.open!==false;
        h+=`<tr>
            <td style="color:#bbb;font-size:0.78rem">${i+1}</td>
            <td><strong>${r.name||'—'}</strong><div style="font-size:0.75rem;color:#bbb">${r.description||''}</div></td>
            <td style="color:#888">${r.cuisineType||r.cuisine||'—'}</td>
            <td style="color:#888;font-size:0.8rem">${r.address||'—'}</td>
            <td style="color:#888">${r.contactNumber||r.contact||'—'}</td>
            <td><span class="badge-s ${open?'bs-open':'bs-closed'}">${open?'Open':'Closed'}</span></td>
            <td>
                <button class="btn-edit-sm" onclick="toggleStatus(${r.id},${open})"><i class="bi bi-toggle-${open?'on':'off'}"></i> ${open?'Close':'Open'}</button>
                <button class="btn-danger-sm" onclick="openDelete(${r.id},'${(r.name||'this restaurant').replace(/'/g,"\\'")}')"><i class="bi bi-trash3"></i></button>
            </td>
        </tr>`;
    });
    h+='</tbody></table>';
    document.getElementById('tableWrap').innerHTML=h;
}

async function openAddModal(){
    document.getElementById('modalAlert').style.display='none';
    ['addName','addCuisine','addDesc','addAddress','addContact','addOpenTime','addCloseTime'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('addOpen').value='true';
    // Load restaurant-role users for owner dropdown
    try{
        const res=await fetch(`${API}/api/user/all`,{headers:H});
        if(res.ok){
            const users=await res.json();
            const owners=users.filter(u=>(u.role||'').includes('RESTAURANT'));
            const sel=document.getElementById('addOwner');
            sel.innerHTML='<option value="">-- Select Owner --</option>';
            owners.forEach(u=>sel.innerHTML+=`<option value="${u.id}">${u.name||u.email}</option>`);
        }
    }catch{}
    new bootstrap.Modal(document.getElementById('addModal')).show();
}

async function addRestaurant(){
    const name=document.getElementById('addName').value.trim();
    const cuisine=document.getElementById('addCuisine').value.trim();
    const address=document.getElementById('addAddress').value.trim();
    if(!name||!cuisine||!address){showModalAlert('Please fill required fields!');return;}
    const body={
        name,cuisineType:cuisine,
        description:document.getElementById('addDesc').value.trim(),
        address,
        contactNumber:document.getElementById('addContact').value.trim(),
        openingTime:document.getElementById('addOpenTime').value.trim(),
        closingTime:document.getElementById('addCloseTime').value.trim(),
        open:document.getElementById('addOpen').value==='true'
    };
    const ownerId=document.getElementById('addOwner').value;
    if(ownerId)body.ownerId=parseInt(ownerId);
    try{
        const res=await fetch(`${API}/api/restaurant/add`,{method:'POST',headers:H,body:JSON.stringify(body)});
        if(res.ok){bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();showToast('success','✅ Restaurant added!');loadRestaurants();}
        else{const d=await res.json();showModalAlert(d.message||'Failed to add restaurant');}
    }catch{showModalAlert('Server error.');}
}

async function toggleStatus(id,currentOpen){
    try{
        const res=await fetch(`${API}/api/restaurant/toggle/${id}?open=${!currentOpen}`,{method:'PUT',headers:H});
        if(res.ok){showToast('success',`Restaurant ${!currentOpen?'opened':'closed'}!`);loadRestaurants();}
        else showToast('danger','Could not update status');
    }catch{showToast('danger','Server error');}
}

function openDelete(id,name){deleteId=id;document.getElementById('deleteRestName').textContent=`Delete "${name}"? This cannot be undone.`;new bootstrap.Modal(document.getElementById('deleteModal')).show();}

async function confirmDelete(){
    if(!deleteId)return;
    try{
        const res=await fetch(`${API}/api/restaurant/delete/${deleteId}`,{method:'DELETE',headers:H});
        bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
        if(res.ok){showToast('success','✅ Restaurant deleted!');loadRestaurants();}
        else showToast('danger','❌ Could not delete');
    }catch{showToast('danger','Server error');}
    deleteId=null;
}

function showModalAlert(msg){const el=document.getElementById('modalAlert');el.style.display='block';el.textContent=msg;}
function logout(){localStorage.clear();window.location.href='login.html';}
function showToast(type,msg){const t=document.getElementById('alertToast');const c={success:'#2ecc71',danger:'#e74c3c',warning:'#f5a623',info:'#3498db'};t.style.cssText=`display:block;background:#fff;border-left:4px solid ${c[type]};color:#333;position:fixed;top:20px;right:20px;z-index:9999;min-width:260px;border-radius:12px;padding:13px 17px;font-size:0.86rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.12)`;t.textContent=msg;setTimeout(()=>t.style.display='none',3500);}
loadRestaurants();
</script>
</body>
</html>
