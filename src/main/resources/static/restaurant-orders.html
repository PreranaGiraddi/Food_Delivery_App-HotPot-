<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotPot | Active Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --fire:#ff6b35; --fire-dark:#e85d2f; --coal:#1a1a2e; --cream:#faf7f2; --success:#2ecc71; --danger:#e74c3c; --gold:#f5a623; --info:#3498db; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'DM Sans',sans-serif; background:var(--cream); display:flex; min-height:100vh; }
        .sidebar { width:240px; min-height:100vh; background:var(--coal); position:fixed; left:0; top:0; z-index:1000; display:flex; flex-direction:column; box-shadow:4px 0 20px rgba(0,0,0,0.25); }
        .sidebar-brand { padding:22px 18px; border-bottom:1px solid rgba(255,255,255,0.07); }
        .brand-logo { font-family:'Syne',sans-serif; font-size:1.5rem; font-weight:800; color:var(--fire); }
        .brand-sub  { font-size:0.62rem; color:rgba(255,255,255,0.3); letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
        .rest-info  { padding:14px 18px; background:rgba(255,107,53,0.07); border-bottom:1px solid rgba(255,255,255,0.05); }
        .rest-name  { font-family:'Syne',sans-serif; font-weight:700; color:#fff; font-size:0.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .rest-badge { display:inline-block; background:var(--fire); color:#fff; font-size:0.58rem; padding:2px 8px; border-radius:20px; font-weight:600; letter-spacing:1px; text-transform:uppercase; margin-top:4px; }
        .sidebar-nav { padding:14px 10px; flex:1; }
        .nav-label   { font-size:0.58rem; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.22); padding:8px 10px 5px; font-weight:600; }
        .nav-item    { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; color:rgba(255,255,255,0.5); cursor:pointer; transition:all 0.2s; margin-bottom:2px; font-size:0.87rem; font-weight:500; text-decoration:none; }
        .nav-item:hover  { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.82); }
        .nav-item.active { background:linear-gradient(135deg,var(--fire),var(--fire-dark)); color:#fff; box-shadow:0 4px 14px rgba(255,107,53,0.3); }
        .nav-item i { font-size:1rem; width:18px; text-align:center; }
        .sidebar-footer { padding:14px 10px; border-top:1px solid rgba(255,255,255,0.07); }
        .logout-btn { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px; color:rgba(255,255,255,0.4); cursor:pointer; border:none; background:none; width:100%; font-size:0.85rem; transition:all 0.2s; }
        .logout-btn:hover { background:rgba(231,76,60,0.12); color:var(--danger); }
        .main-content { margin-left:240px; flex:1; }
        .top-bar { background:#fff; padding:15px 28px; border-bottom:1px solid #eee; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
        .page-title    { font-family:'Syne',sans-serif; font-size:1.2rem; font-weight:700; color:var(--coal); }
        .page-subtitle { font-size:0.77rem; color:#aaa; }
        .content-area  { padding:24px 28px; }

        /* FILTER PILLS */
        .filter-pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
        .pill { padding:8px 18px; border-radius:50px; font-size:0.82rem; font-weight:600; cursor:pointer; border:1.5px solid #e0e0e0; background:#fff; color:#888; transition:all 0.2s; }
        .pill:hover   { border-color:var(--fire); color:var(--fire); }
        .pill.active  { background:var(--fire); border-color:var(--fire); color:#fff; box-shadow:0 4px 12px rgba(255,107,53,0.25); }

        /* ORDER CARDS */
        .order-card { background:#fff; border-radius:14px; border:1.5px solid #f0f0f0; margin-bottom:14px; overflow:hidden; transition:all 0.2s; }
        .order-card:hover { border-color:#ddd; box-shadow:0 4px 16px rgba(0,0,0,0.06); }
        .order-card.new-order { border-color:rgba(255,107,53,0.4); animation:pulseCard 2s ease-in-out infinite; }
        @keyframes pulseCard { 0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,0);} 50%{box-shadow:0 0 0 4px rgba(255,107,53,0.15);} }

        .order-head { padding:13px 18px; background:#fafafa; border-bottom:1px solid #f5f5f5; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
        .order-id   { font-family:'Syne',sans-serif; font-weight:800; font-size:1rem; color:var(--coal); }
        .order-time { font-size:0.78rem; color:#bbb; }

        .order-body  { padding:16px 18px; }
        .customer-info { display:flex; gap:20px; margin-bottom:12px; flex-wrap:wrap; }
        .cust-detail { font-size:0.83rem; color:#666; }
        .cust-label  { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.5px; color:#bbb; font-weight:600; }

        .items-list { background:#fafafa; border-radius:10px; padding:12px; margin-bottom:12px; }
        .item-row   { display:flex; justify-content:space-between; font-size:0.84rem; color:#555; padding:4px 0; border-bottom:1px solid #f0f0f0; }
        .item-row:last-child { border-bottom:none; }
        .order-total { font-family:'Syne',sans-serif; font-weight:800; font-size:1rem; color:var(--coal); }

        .order-foot { padding:12px 18px; border-top:1px solid #f5f5f5; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }

        /* STATUS SELECT STYLED */
        .status-update { display:flex; align-items:center; gap:10px; }
        .status-select { border:1.5px solid #eee; border-radius:10px; padding:8px 14px; font-size:0.84rem; font-weight:600; cursor:pointer; background:#fff; transition:border-color 0.2s; }
        .status-select:focus { outline:none; border-color:var(--fire); }
        .btn-update { background:var(--fire); color:#fff; border:none; border-radius:10px; padding:8px 16px; font-weight:600; font-size:0.82rem; cursor:pointer; transition:all 0.2s; }
        .btn-update:hover { background:var(--fire-dark); }

        /* BADGES */
        .badge-s { padding:5px 13px; border-radius:20px; font-size:0.73rem; font-weight:700; }
        .bs-placed     { background:rgba(52,152,219,0.12);  color:var(--info); }
        .bs-confirmed  { background:rgba(245,166,35,0.12);  color:var(--gold); }
        .bs-processing { background:rgba(155,89,182,0.12);  color:#9b59b6; }
        .bs-dispatched { background:rgba(46,204,113,0.12);  color:var(--success); }
        .bs-delivered  { background:rgba(46,204,113,0.18);  color:#27ae60; }
        .bs-cancelled  { background:rgba(231,76,60,0.12);   color:var(--danger); }

        /* REFRESH BUTTON */
        .btn-refresh { background:#fff; border:1.5px solid #eee; border-radius:10px; padding:8px 16px; font-size:0.82rem; font-weight:600; color:#888; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; gap:6px; }
        .btn-refresh:hover { border-color:var(--fire); color:var(--fire); }

        /* COUNTDOWN */
        .auto-refresh { font-size:0.75rem; color:#ccc; }

        .alert-toast { position:fixed; top:20px;right:20px; z-index:9999; min-width:260px; border-radius:12px; padding:13px 17px; font-size:0.86rem; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,0.12); display:none; }
        .loading-box { display:flex; align-items:center; justify-content:center; padding:40px; color:#ccc; gap:10px; font-size:0.86rem; }
        .empty-state { text-align:center; padding:50px 20px; color:#ccc; }
        .empty-icon  { font-size:3rem; margin-bottom:12px; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-logo">🍲 HotPot</div>
        <div class="brand-sub">Restaurant Portal</div>
    </div>
    <div class="rest-info">
        <div class="rest-name" id="sidebarName">Loading...</div>
        <span class="rest-badge">🟢 Active</span>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-label">Main</div>
        <a class="nav-item" href="restaurant-dashboard.html"><i class="bi bi-grid-fill"></i> Overview</a>
        <a class="nav-item active" href="restaurant-orders.html"><i class="bi bi-bag-check-fill"></i> Active Orders</a>
        <a class="nav-item" href="restaurant-order-history.html"><i class="bi bi-clock-history"></i> Order History</a>
        <div class="nav-label mt-2">Menu</div>
        <a class="nav-item" href="restaurant-menu.html"><i class="bi bi-egg-fried"></i> Menu Items</a>
        <a class="nav-item" href="restaurant-categories.html"><i class="bi bi-tags-fill"></i> Categories</a>
    </nav>
    <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</button>
    </div>
</aside>

<div class="main-content">
    <div class="top-bar">
        <div>
            <div class="page-title">Active Orders</div>
            <div class="page-subtitle">Manage incoming orders and update their delivery status.</div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="auto-refresh" id="refreshTimer">Auto-refreshes every 60s</span>
            <button class="btn-refresh" onclick="loadOrders()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        </div>
    </div>

    <div class="alert-toast" id="alertToast"></div>

    <div class="content-area">
        <!-- FILTER PILLS -->
        <div class="filter-pills">
            <div class="pill active" onclick="filterOrders('ALL', this)">📦 All</div>
            <div class="pill" onclick="filterOrders('PLACED', this)">🆕 Placed</div>
            <div class="pill" onclick="filterOrders('CONFIRMED', this)">✅ Confirmed</div>
            <div class="pill" onclick="filterOrders('PROCESSING', this)">👨‍🍳 Processing</div>
            <div class="pill" onclick="filterOrders('DISPATCHED', this)">🛵 Dispatched</div>
            <div class="pill" onclick="filterOrders('CANCELLED', this)">❌ Cancelled</div>
        </div>

        <!-- ORDER CARDS -->
        <div id="ordersContainer">
            <div class="loading-box"><div class="spinner-border spinner-border-sm text-secondary"></div> Loading orders...</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API    = 'http://localhost:8080';
const token  = localStorage.getItem('token');
const userId = localStorage.getItem('userId');
let restId   = localStorage.getItem('restaurantId');
let allOrders = [];
let currentFilter = 'ALL';

window.onload = function() {
    if (!token || !userId) { window.location.href = 'login.html'; return; }
    loadRestaurant();
    // Auto refresh every 60s
    setInterval(() => loadOrders(), 60000);
};

async function loadRestaurant() {
    if (restId) { document.getElementById('sidebarName').textContent = 'My Restaurant'; loadOrders(); return; }
    try {
        const res  = await fetch(`${API}/api/restaurant/owner/${userId}`, { headers: { 'Authorization':'Bearer '+token } });
        const data = await res.json();
        const rest = Array.isArray(data) ? data[0] : data;
        if (!rest) { showAlert('danger','No restaurant found!'); return; }
        restId = rest.id;
        localStorage.setItem('restaurantId', rest.id);
        document.getElementById('sidebarName').textContent = rest.name;
        loadOrders();
    } catch(e) { showAlert('danger','Server error!'); }
}

async function loadOrders() {
    try {
        const res = await fetch(`${API}/api/order/restaurant/${restId}`, { headers: { 'Authorization':'Bearer '+token } });
        allOrders = res.ok ? await res.json() : [];
        // Show all EXCEPT delivered (those go to history)
        const active = allOrders.filter(o => o.status !== 'DELIVERED');
        filterOrders(currentFilter);
    } catch(e) { console.error(e); }
}

function filterOrders(status, el) {
    currentFilter = status;
    // Update pill styles
    if (el) {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
    }
    const show = status === 'ALL'
        ? allOrders.filter(o => o.status !== 'DELIVERED')
        : allOrders.filter(o => o.status === status);
    renderOrders(show);
}

function renderOrders(orders) {
    const el = document.getElementById('ordersContainer');
    if (!orders.length) {
        el.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div>No orders found for this filter!</div></div>`;
        return;
    }
    // Sort: newest first
    const sorted = [...orders].sort((a,b) => new Date(b.orderedAt) - new Date(a.orderedAt));
    el.innerHTML = sorted.map(o => {
        const isNew = o.status === 'PLACED';
        const items = (o.orderItems||[]);
        return `
        <div class="order-card ${isNew ? 'new-order' : ''}">
            <div class="order-head">
                <div>
                    <div class="order-id">📦 Order #${o.id} ${isNew ? '<span style="color:var(--fire);font-size:0.75rem">● NEW</span>' : ''}</div>
                    <div class="order-time">🕐 ${fmt(o.orderedAt)}</div>
                </div>
                <span class="badge-s bs-${o.status?.toLowerCase()}">${o.status}</span>
            </div>
            <div class="order-body">
                <div class="customer-info">
                    <div><div class="cust-label">Customer</div><div class="cust-detail">👤 ${o.user?.name||'Customer'}</div></div>
                    <div><div class="cust-label">Contact</div><div class="cust-detail">📞 ${o.user?.contactNumber||'—'}</div></div>
                    <div><div class="cust-label">Delivery Address</div><div class="cust-detail">📍 ${o.deliveryAddress||'—'}</div></div>
                    <div><div class="cust-label">Payment</div><div class="cust-detail">💳 ${o.paymentMethod||'COD'}</div></div>
                </div>
                <div class="items-list">
                    ${items.map(i=>`
                    <div class="item-row">
                        <span>🍽️ ${i.menuItem?.name||'Item'} × ${i.quantity}</span>
                        <span class="fw-bold">₹${(i.price||0).toFixed(2)}</span>
                    </div>`).join('')}
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="text-muted" style="font-size:0.82rem">${items.length} item(s)</span>
                    <div class="order-total">Total: ₹${(o.totalAmount||0).toFixed(2)}</div>
                </div>
            </div>
            <div class="order-foot">
                <div class="status-update">
                    <select class="status-select" id="sel_${o.id}">
                        <option value="">Update Status</option>
                        ${o.status === 'PLACED'     ? `<option value="CONFIRMED">✅ Confirm Order</option>` : ''}
                        ${o.status === 'CONFIRMED'  ? `<option value="PROCESSING">👨‍🍳 Start Processing</option>` : ''}
                        ${o.status === 'PROCESSING' ? `<option value="DISPATCHED">🛵 Dispatch Order</option>` : ''}
                        ${o.status === 'DISPATCHED' ? `<option value="DELIVERED">🎉 Mark Delivered</option>` : ''}
                        ${o.status !== 'DELIVERED' && o.status !== 'CANCELLED' ? `<option value="CANCELLED">❌ Cancel Order</option>` : ''}
                    </select>
                    <button class="btn-update" onclick="updateStatus(${o.id})">Update</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

async function updateStatus(orderId) {
    const newStatus = document.getElementById('sel_'+orderId).value;
    if (!newStatus) { showAlert('warning','Please select a status to update!'); return; }
    if (newStatus === 'CANCELLED' && !confirm('Are you sure you want to CANCEL this order?')) return;

    try {
        // ✅ Step 1: Update order status
        const res = await fetch(`${API}/api/order/status/${orderId}?status=${newStatus}`, {
            method:'PUT',
            headers:{ 'Authorization':'Bearer '+token }
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            showAlert('danger', err.message || 'Order status update failed!');
            return;
        }

        // ✅ Step 2: Sync tracking table so user dashboard shows updated status
        try {
            await fetch(`${API}/api/tracking/update/${orderId}?status=${newStatus}`, {
                method:'PUT',
                headers:{ 'Authorization':'Bearer '+token }
            });
        } catch(trackErr) {
            console.warn('Tracking update failed (non-critical):', trackErr);
        }

        showAlert('success', `✅ Order #${orderId} updated to ${newStatus}`);
        loadOrders();

    } catch(e) { showAlert('danger','Server error: ' + e.message); }
}

function fmt(d) { if (!d) return '—'; return new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function showAlert(type, msg) { const el=document.getElementById('alertToast'); el.className=`alert-toast alert alert-${type}`; el.textContent=msg; el.style.display='block'; setTimeout(()=>el.style.display='none',3500); }
function logout() { if(confirm('Logout?')){ localStorage.clear(); window.location.href='index.html'; } }
</script>
</body>
</html>
