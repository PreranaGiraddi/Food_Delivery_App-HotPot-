<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotPot - Order Food Online</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .hero-section {
            background: linear-gradient(135deg, #ff6b35, #f7c59f);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ff6b35 !important;
        }

        .feature-card {
            border: none;
            border-radius: 15px;
            transition: transform 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .feature-card:hover {
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 3rem;
            color: #ff6b35;
        }

        .btn-hotpot {
            background-color: #ff6b35;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .btn-hotpot:hover {
            background-color: #e55a25;
            color: white;
        }

        footer {
            background-color: #2d2d2d;
            color: #aaa;
        }

        footer a {
            color: #ff6b35;
            text-decoration: none;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">🍲 HotPot</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link" href="restaurants.html">Restaurants</a>
                </li>

                <li class="nav-item" id="loginNav">
                    <a class="nav-link" href="login.html">Login</a>
                </li>

                <li class="nav-item" id="registerNav">
                    <a class="btn btn-hotpot ms-2" href="register.html">Register</a>
                </li>

                <li class="nav-item d-none" id="logoutNav">
                    <button class="btn btn-outline-danger ms-2" onclick="logout()">Logout</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<section class="hero-section">
    <div class="container text-white">
        <h1 class="display-4 fw-bold">Delicious Food Delivered Fast! 🍲</h1>
        <p class="lead">Order from your favourite restaurants easily.</p>
        <a href="restaurants.html" class="btn btn-light">Browse Restaurants</a>
    </div>
</section>

<footer class="py-4 text-center">
    <p>© 2024 HotPot. All rights reserved.</p>
</footer>

<script>
    window.onload = function () {
        const token = localStorage.getItem('token');

        if (token) {
            document.getElementById('loginNav').classList.add('d-none');
            document.getElementById('registerNav').classList.add('d-none');
            document.getElementById('logoutNav').classList.remove('d-none');
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
