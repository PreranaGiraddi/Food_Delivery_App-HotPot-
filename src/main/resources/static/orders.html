<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotPot - My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire: #ff6b35;
            --fire-dark: #e04e1a;
            --dark: #1a1008;
        }
        * { box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: #f5f0eb; }

        /* NAVBAR */
        .navbar { background: rgba(26,16,8,0.92) !important; backdrop-filter:blur(16px); border-bottom:1px solid rgba(255,107,53,0.15); padding:0.85rem 0; }
        .navbar-brand { font-family:'Playfair Display',serif !important; font-size:1.8rem !important; font-weight:900 !important; color:var(--fire) !important; }
        .navbar-brand span { color:#fff; }
        .nav-link { color:rgba(255,255,255,0.75) !important; font-weight:500; font-size:0.92rem; transition:color 0.2s; }
        .nav-link:hover, .nav-link.active-link { color:var(--fire) !important; }
        .navbar-toggler { border-color:rgba(255,107,53,0.4); }
        .navbar-toggler-icon { background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255,107,53,0.9%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e"); }

        /* PAGE HEADER */
        .page-header {
            background:
                linear-gradient(135deg, rgba(26,16,8,0.88), rgba(61,32,16,0.72)),
                url('https://images.unsplash.com/photo-1565299507177-b0ac66763828?w=1400&q=80') center/cover no-repeat;
            padding: 48px 0 40px;
        }
        .page-header h3 { font-family:'Playfair Display',serif; font-size:clamp(1.8rem,4vw,2.6rem); font-weight:900; color:#fff; margin-bottom:0; }
        .page-header p { color:rgba(255,255,255,0.5); font-size:0.88rem; margin-top:4px; }

        /* ORDER CARD */
        .order-card {
            background: #fff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 2px 20px rgba(26,16,8,0.07);
            margin-bottom: 1.25rem;
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            overflow: hidden;
        }
        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(255,107,53,0.13);
        }

        /* STATUS ACCENT LINE */
        .order-card::before {
            content: '';
            display: block;
            height: 4px;
            width: 100%;
        }
        .order-card.status-PLACED::before    { background: linear-gradient(90deg,#ffc107,#ffe082); }
        .order-card.status-CONFIRMED::before { background: linear-gradient(90deg,#2196f3,#90caf9); }
        .order-card.status-PROCESSING::before{ background: linear-gradient(90deg,#00bcd4,#80deea); }
        .order-card.status-DISPATCHED::before{ background: linear-gradient(90deg,#4caf50,#a5d6a7); }
        .order-card.status-DELIVERED::before { background: linear-gradient(90deg,#43a047,#81c784); }
        .order-card.status-CANCELLED::before { background: linear-gradient(90deg,#ef5350,#ef9a9a); }

        .order-id { font-family:'Playfair Display',serif; font-size:1.1rem; font-weight:700; color:var(--dark); }

        /* STATUS BADGES */
        .status-pill {
            font-size: 0.72rem; font-weight: 700;
            padding: 5px 12px; border-radius: 50px;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .pill-PLACED     { background:#fff8e1; color:#f57f17; }
        .pill-CONFIRMED  { background:#e3f2fd; color:#1565c0; }
        .pill-PROCESSING { background:#e0f7fa; color:#00695c; }
        .pill-DISPATCHED { background:#e8f5e9; color:#2e7d32; }
        .pill-DELIVERED  { background:#e8f5e9; color:#1b5e20; }
        .pill-CANCELLED  { background:#ffebee; color:#b71c1c; }

        .order-restaurant { font-weight: 600; font-size: 0.9rem; color: var(--dark); }
        .order-meta { font-size: 0.8rem; color: #9e8070; }
        .order-item-chip {
            display: inline-block;
            background: #fff5f0;
            color: #7a6055;
            border: 1px solid rgba(255,107,53,0.15);
            border-radius: 50px;
            padding: 3px 10px;
            font-size: 0.72rem;
            font-weight: 500;
            margin: 2px;
        }
        .order-total { font-family:'Playfair Display',serif; font-size:1.4rem; font-weight:900; color:var(--fire); }

        /* ACTION BUTTONS */
        .btn-track {
            background: linear-gradient(135deg, var(--fire), var(--fire-dark));
            color: white; border: none; border-radius: 50px;
            padding: 8px 20px; font-size: 0.85rem; font-weight: 600;
            transition: all 0.3s; box-shadow: 0 4px 12px rgba(255,107,53,0.3);
            font-family: 'DM Sans', sans-serif; white-space: nowrap;
        }
        .btn-track:hover { color:white; transform:translateY(-1px); box-shadow:0 8px 20px rgba(255,107,53,0.4); }

        .btn-cancel {
            background: transparent; color: #c0897a;
            border: 1.5px solid #f0ddd8; border-radius: 50px;
            padding: 7px 18px; font-size: 0.82rem; font-weight: 600;
            transition: all 0.2s; font-family: 'DM Sans', sans-serif; white-space: nowrap;
        }
        .btn-cancel:hover { background: #dc3545; border-color: #dc3545; color: white; }

        /* EMPTY STATE */
        .empty-orders { min-height: 380px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .empty-icon { font-size: 5rem; opacity: 0.35; }
        .btn-browse {
            background: linear-gradient(135deg, var(--fire), var(--fire-dark));
            color: white; border: none; border-radius: 50px;
            padding: 12px 32px; font-weight: 700; font-size: 0.95rem;
            transition: all 0.3s; box-shadow: 0 6px 20px rgba(255,107,53,0.3);
            text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-browse:hover { color:white; transform:translateY(-2px); }

        /* TRACKING MODAL */
        .modal-content { border-radius: 22px !important; border: none !important; overflow: hidden; }
        .modal-header { background: var(--dark); border-bottom: none; padding: 1.1rem 1.5rem; }
        .modal-title { font-family:'Playfair Display',serif; color: #fff; font-size: 1.2rem; }
        .btn-close { filter: invert(1); }
        .modal-order-id { color: rgba(255,255,255,0.45); font-size: 0.82rem; }

        /* TRACKING STEPS */
        .tracking-row {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding-bottom: 18px;
            position: relative;
        }
        .tracking-row:not(:last-child)::before {
            content: '';
            position: absolute;
            left: 9px;
            top: 22px;
            width: 2px;
            height: calc(100% - 4px);
            background: #f0e8e0;
        }
        .track-dot {
            width: 20px; height: 20px; border-radius: 50%;
            flex-shrink: 0; margin-top: 2px; position: relative; z-index: 1;
            transition: all 0.3s;
        }
        .track-dot.done    { background: #43a047; box-shadow: 0 0 0 3px rgba(67,160,71,0.2); }
        .track-dot.current { background: var(--fire); box-shadow: 0 0 0 5px rgba(255,107,53,0.2); }
        .track-dot.pending { background: #e8ddd5; }

        .track-label { font-weight: 700; font-size: 0.92rem; color: var(--dark); }
        .track-sub { font-size: 0.78rem; }
        .track-sub.done    { color: #43a047; }
        .track-sub.current { color: var(--fire); font-weight: 700; }
        .track-sub.pending { color: #b09080; }

        footer { background:#1a1008; color:rgba(255,255,255,0.35); border-top:1px solid rgba(255,107,53,0.1); }
        footer strong { color:var(--fire); }
        #alertBox { border-radius:12px; font-weight:500; }
        .spinner-border { color: var(--fire) !important; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">🍲 Hot<span>Pot</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center gap-1">
                <li class="nav-item"><a class="nav-link" href="restaurants.html"><i class="bi bi-shop me-1"></i>Restaurants</a></li>
                <li class="nav-item"><a class="nav-link" href="cart.html"><i class="bi bi-cart3 me-1"></i>Cart</a></li>
                <li class="nav-item"><a class="nav-link active-link" href="orders.html"><i class="bi bi-bag-check me-1"></i>My Orders</a></li>
                <li class="nav-item"><span class="nav-link fw-bold" id="userName" style="color:#ffc107;"></span></li>
                <li class="nav-item"><button class="btn btn-outline-danger ms-2" onclick="logout()">Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<!-- HEADER -->
<div class="page-header">
    <div class="container">
        <h3><i class="bi bi-bag-check me-2"></i>My Orders</h3>
        <p>Track and manage all your orders</p>
    </div>
</div>

<div class="container py-4">
    <div id="alertBox" class="alert d-none"></div>

    <!-- Loading -->
    <div id="loadingSection" class="text-center py-5">
        <div class="spinner-border" style="width:3rem;height:3rem;"></div>
        <p class="mt-3 text-muted">Loading orders...</p>
    </div>

    <!-- Empty -->
    <div id="emptyOrders" class="d-none">
        <div class="empty-orders text-center">
            <div class="empty-icon">📦</div>
            <h4 class="mt-3 fw-bold" style="color:#9e8070;">No orders yet!</h4>
            <p class="text-muted mb-4">Order something delicious from your favourite restaurant</p>
            <a href="restaurants.html" class="btn-browse">
                <i class="bi bi-shop"></i> Browse Restaurants
            </a>
        </div>
    </div>

    <div id="ordersList"></div>
</div>

<!-- TRACKING MODAL -->
<div class="modal fade" id="trackingModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title"><i class="bi bi-geo-alt me-2"></i>Order Tracking</h5>
                    <div class="modal-order-id" id="trackingOrderId"></div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4" id="trackingSteps"></div>
        </div>
    </div>
</div>

<footer class="py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">🍲 <strong>HotPot</strong> © 2024</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API    = 'http://localhost:8080';
    const token  = localStorage.getItem('token');
    const userId = localStorage.getItem('userId');

    const allSteps = [
        { key:'PLACED',      label:'Order Placed',    icon:'📋' },
        { key:'CONFIRMED',   label:'Order Confirmed',  icon:'✅' },
        { key:'PROCESSING',  label:'Being Prepared',   icon:'👨‍🍳' },
        { key:'DISPATCHED',  label:'Out for Delivery', icon:'🚴' },
        { key:'DELIVERED',   label:'Delivered',        icon:'🎉' }
    ];

    window.onload = function () {
        if (!token || !userId) { window.location.href = 'login.html'; return; }
        document.getElementById('userName').textContent = '👤 ' + localStorage.getItem('userName');
        loadOrders();
    }

    async function loadOrders() {
        try {
            const response = await fetch(`${API}/api/order/history/${userId}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await response.json();
            document.getElementById('loadingSection').classList.add('d-none');
            if (!data || data.length === 0) {
                document.getElementById('emptyOrders').classList.remove('d-none');
                return;
            }
            displayOrders(data);
        } catch (error) {
            document.getElementById('loadingSection').classList.add('d-none');
            showAlert('danger', 'Cannot load orders!');
        }
    }

    function displayOrders(orders) {
        const list = document.getElementById('ordersList');
        list.innerHTML = '';

        orders.forEach(order => {
            const date = new Date(order.orderedAt).toLocaleString('en-IN');
            const isCancellable = !['DELIVERED','CANCELLED'].includes(order.status);
            const statusLabel = order.status || 'PLACED';

            const itemChips = order.orderItems
                ? order.orderItems.map(item =>
                    `<span class="order-item-chip">${item.menuItem ? item.menuItem.name : 'Item'} ×${item.quantity}</span>`
                  ).join('')
                : '<span class="order-item-chip text-muted">No items</span>';

            const card = document.createElement('div');
            card.className = `card order-card status-${statusLabel}`;
            card.innerHTML = `
                <div class="card-body p-4">
                    <div class="row align-items-center g-3">

                        <!-- Info -->
                        <div class="col-md-5">
                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
                                <div class="order-id">Order #${order.id}</div>
                                <span class="status-pill pill-${statusLabel}">
                                    ${getStatusIcon(statusLabel)} ${statusLabel}
                                </span>
                            </div>
                            <div class="order-restaurant mb-1">
                                <i class="bi bi-shop me-1" style="color:var(--fire);"></i>
                                ${order.restaurant ? order.restaurant.name : 'Restaurant'}
                            </div>
                            <div class="order-meta mb-1">
                                <i class="bi bi-calendar me-1"></i>${date}
                            </div>
                            <div class="order-meta">
                                <i class="bi bi-geo-alt me-1"></i>${order.deliveryAddress}
                            </div>
                        </div>

                        <!-- Items -->
                        <div class="col-md-4">
                            <div style="font-size:0.72rem;font-weight:700;letter-spacing:1px;color:#b09080;text-transform:uppercase;margin-bottom:6px;">Items</div>
                            <div>${itemChips}</div>
                        </div>

                        <!-- Total + Actions -->
                        <div class="col-md-3 text-md-end">
                            <div class="order-total mb-3">₹${order.totalAmount ? order.totalAmount.toFixed(2) : '0.00'}</div>
                            <div class="d-flex flex-column gap-2 align-items-md-end">
                                <button class="btn-track" onclick="trackOrder(${order.id})">
                                    <i class="bi bi-geo-alt me-1"></i>Track
                                </button>
                                ${isCancellable ? `
                                <button class="btn-cancel" onclick="cancelOrder(${order.id})">
                                    <i class="bi bi-x-circle me-1"></i>Cancel
                                </button>` : ''}
                            </div>
                        </div>
                    </div>
                </div>`;
            list.appendChild(card);
        });
    }

    async function trackOrder(orderId) {
        document.getElementById('trackingOrderId').textContent = 'Order #' + orderId;
        document.getElementById('trackingSteps').innerHTML = `
            <div class="text-center py-3">
                <div class="spinner-border spinner-border-sm"></div>
                <p class="mt-2 text-muted small">Loading tracking...</p>
            </div>`;

        const modal = new bootstrap.Modal(document.getElementById('trackingModal'));
        modal.show();

        try {
            const response = await fetch(`${API}/api/tracking/order/${orderId}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (response.ok) {
                const tracking = await response.json();
                const status = tracking.status || (tracking.order && tracking.order.status) || 'PLACED';
                displayTrackingSteps(status, tracking.message);
            } else if (response.status === 404) {
                displayTrackingSteps('PLACED', 'Order placed successfully!');
            } else {
                document.getElementById('trackingSteps').innerHTML = '<p class="text-danger text-center">Failed to load tracking!</p>';
            }
        } catch (error) {
            displayTrackingSteps('PLACED', 'Order placed successfully!');
        }
    }

    function displayTrackingSteps(currentStatus, message) {
        const container = document.getElementById('trackingSteps');
        container.innerHTML = '';

        if (currentStatus === 'CANCELLED') {
            container.innerHTML = `
                <div class="text-center py-4">
                    <div style="font-size:3rem;">❌</div>
                    <h5 class="mt-2 fw-bold" style="color:#ef5350;">Order Cancelled</h5>
                    <p class="text-muted">This order has been cancelled.</p>
                </div>`;
            return;
        }

        if (message) {
            container.innerHTML += `
                <div class="alert mb-4" style="background:#fff5f0;border:1px solid rgba(255,107,53,0.2);border-radius:12px;color:var(--dark);font-size:0.88rem;">
                    <i class="bi bi-info-circle me-2" style="color:var(--fire);"></i><strong>${message}</strong>
                </div>`;
        }

        const currentIndex = allSteps.findIndex(s => s.key === currentStatus);

        allSteps.forEach((step, index) => {
            let dotClass  = 'pending';
            let subClass  = 'pending';
            let subText   = 'Pending';

            if (index < currentIndex)  { dotClass = 'done';    subClass = 'done';    subText = 'Completed ✓'; }
            if (index === currentIndex){ dotClass = 'current'; subClass = 'current'; subText = '← You are here'; }

            const isLast = index === allSteps.length - 1;
            container.innerHTML += `
                <div class="tracking-row ${isLast ? 'pb-0' : ''}">
                    <div class="track-dot ${dotClass}"></div>
                    <div>
                        <div class="track-label">${step.icon} ${step.label}</div>
                        <div class="track-sub ${subClass}">${subText}</div>
                    </div>
                </div>`;
        });
    }

    async function cancelOrder(orderId) {
        if (!confirm('Are you sure you want to cancel this order?')) return;
        try {
            const response = await fetch(`${API}/api/order/cancel/${orderId}`, {
                method: 'PUT', headers: { 'Authorization': 'Bearer ' + token }
            });
            if (response.ok) { showAlert('success', 'Order cancelled successfully!'); loadOrders(); }
            else { const data = await response.json(); showAlert('danger', data.message || 'Cannot cancel order!'); }
        } catch (error) { showAlert('danger', 'Server error!'); }
    }

    function getStatusIcon(status) {
        const icons = { 'PLACED':'📋','CONFIRMED':'✅','PROCESSING':'👨‍🍳','DISPATCHED':'🚴','DELIVERED':'🎉','CANCELLED':'❌' };
        return icons[status] || '📦';
    }

    function showAlert(type, msg) {
        const el = document.getElementById('alertBox');
        el.className = `alert alert-${type}`;
        el.textContent = msg;
        el.classList.remove('d-none');
        setTimeout(() => el.classList.add('d-none'), 3000);
    }

    function logout() { localStorage.clear(); window.location.href = 'index.html'; }
</script>
</body>
</html>
