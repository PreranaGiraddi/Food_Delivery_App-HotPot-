<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotPot - My Orders</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
	rel="stylesheet">
<style>
.navbar-brand {
	color: #ff6b35 !important;
	font-size: 1.8rem;
	font-weight: 700;
}

.btn-hotpot {
	background-color: #ff6b35;
	color: white;
	border: none;
	border-radius: 25px;
	padding: 8px 20px;
}

.btn-hotpot:hover {
	background-color: #e55a25;
	color: white;
}

.order-card {
	border: none;
	border-radius: 15px;
	box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
	margin-bottom: 20px;
	transition: transform 0.2s;
}

.order-card:hover {
	transform: translateY(-3px);
}

.status-PLACED {
	background: #fff3cd;
	color: #856404;
}

.status-CONFIRMED {
	background: #cce5ff;
	color: #004085;
}

.status-PROCESSING {
	background: #d1ecf1;
	color: #0c5460;
}

.status-DISPATCHED {
	background: #d4edda;
	color: #155724;
}

.status-DELIVERED {
	background: #d4edda;
	color: #155724;
}

.status-CANCELLED {
	background: #f8d7da;
	color: #721c24;
}

.status-badge {
	padding: 6px 15px;
	border-radius: 25px;
	font-weight: 600;
	font-size: 0.85rem;
}

.tracking-step {
	display: flex;
	align-items: center;
	margin-bottom: 15px;
}

.tracking-dot {
	width: 20px;
	height: 20px;
	border-radius: 50%;
	margin-right: 15px;
	flex-shrink: 0;
}

.tracking-dot.done {
	background: #28a745;
}

.tracking-dot.current {
	background: #ff6b35;
	box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.3);
}

.tracking-dot.pending {
	background: #dee2e6;
}

.tracking-line {
	width: 2px;
	height: 20px;
	background: #dee2e6;
	margin-left: 9px;
	margin-bottom: 0;
}

.price-tag {
	color: #ff6b35;
	font-weight: 700;
}

.empty-orders {
	min-height: 400px;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
}

footer {
	background-color: #2d2d2d;
	color: #aaa;
}
</style>
</head>
<body class="bg-light">

	<!-- NAVBAR -->
	<nav
		class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
		<div class="container">
			<a class="navbar-brand" href="index.html">🍲 HotPot</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto align-items-center">
					<li class="nav-item"><a class="nav-link"
						href="restaurants.html"><i class="bi bi-shop"></i> Restaurants</a></li>
					<li class="nav-item"><a class="nav-link" href="cart.html"><i
							class="bi bi-cart3"></i> Cart</a></li>
					<li class="nav-item"><a class="nav-link fw-bold"
						href="orders.html" style="color: #ff6b35"><i
							class="bi bi-bag-check"></i> My Orders</a></li>
					<li class="nav-item"><span
						class="nav-link fw-bold text-warning" id="userName"></span></li>
					<li class="nav-item"><button
							class="btn btn-outline-danger ms-2" onclick="logout()">Logout</button></li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- HEADER -->
	<div
		style="background: linear-gradient(135deg, #ff6b35, #f7c59f); padding: 25px 0;">
		<div class="container text-white">
			<h3 class="fw-bold mb-0">
				<i class="bi bi-bag-check"></i> My Orders
			</h3>
			<p class="mb-0">Track all your orders here</p>
		</div>
	</div>

	<div class="container py-4">
		<div id="alertBox" class="alert d-none"></div>

		<!-- Loading -->
		<div id="loadingSection" class="text-center py-5">
			<div class="spinner-border text-warning"
				style="width: 3rem; height: 3rem;"></div>
			<p class="mt-3 text-muted">Loading orders...</p>
		</div>

		<!-- Empty Orders -->
		<div id="emptyOrders" class="d-none">
			<div class="empty-orders text-center">
				<div style="font-size: 5rem">📦</div>
				<h4 class="mt-3 text-muted">No orders yet!</h4>
				<p class="text-muted">Order something delicious!</p>
				<a href="restaurants.html" class="btn btn-hotpot mt-2"> <i
					class="bi bi-shop"></i> Browse Restaurants
				</a>
			</div>
		</div>

		<!-- Orders List -->
		<div id="ordersList"></div>
	</div>

	<!-- TRACKING MODAL -->
	<div class="modal fade" id="trackingModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content" style="border-radius: 20px; border: none;">
				<div class="modal-header border-0">
					<h5 class="modal-title fw-bold">
						<i class="bi bi-geo-alt"></i> Order Tracking
					</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body px-4 pb-4">
					<p class="text-muted" id="trackingOrderId"></p>
					<div id="trackingSteps"></div>
				</div>
			</div>
		</div>
	</div>

	<footer class="py-4 mt-5">
		<div class="container text-center">
			<p class="mb-0">
				🍲 <strong class="text-white">HotPot</strong> © 2024
			</p>
		</div>
	</footer>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
    const API    = 'http://localhost:8080';
    const token  = localStorage.getItem('token');
    const userId = localStorage.getItem('userId');

    // All tracking steps in order
    const allSteps = [
        { key:'PLACED',           label:'Order Placed',       icon:'📋' },
        { key:'CONFIRMED',        label:'Order Confirmed',     icon:'✅' },
        { key:'PROCESSING',       label:'Being Prepared',      icon:'👨‍🍳' },
        { key:'DISPATCHED',       label:'Out for Delivery',    icon:'🚴' },
        { key:'DELIVERED',        label:'Delivered',           icon:'🎉' }
    ];

    window.onload = function () {
        if (!token || !userId) {
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('userName').textContent =
            '👤 ' + localStorage.getItem('userName');
        loadOrders();
    }

    async function loadOrders() {
        try {
            const response = await fetch(`${API}/api/order/history/${userId}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await response.json();

            document.getElementById('loadingSection').classList.add('d-none');

            if (!data || data.length === 0) {
                document.getElementById('emptyOrders').classList.remove('d-none');
                return;
            }

            displayOrders(data);

        } catch (error) {
            document.getElementById('loadingSection').classList.add('d-none');
            showAlert('danger', 'Cannot load orders!');
        }
    }

    function displayOrders(orders) {
        const list = document.getElementById('ordersList');
        list.innerHTML = '';

        orders.forEach(order => {
            const date = new Date(order.orderedAt).toLocaleString('en-IN');
            const isCancellable = !['DELIVERED','CANCELLED'].includes(order.status);

            const card = document.createElement('div');
            card.className = 'card order-card';
            card.innerHTML = `
                <div class="card-body p-4">
                    <div class="row align-items-center">

                        <!-- Order Info -->
                        <div class="col-md-5">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h6 class="fw-bold mb-0">Order #${order.id}</h6>
                                <span class="status-badge status-${order.status}">
                                    ${getStatusIcon(order.status)} ${order.status}
                                </span>
                            </div>
                            <p class="text-muted small mb-1">
                                <i class="bi bi-shop"></i>
                                ${order.restaurant ? order.restaurant.name : 'Restaurant'}
                            </p>
                            <p class="text-muted small mb-1">
                                <i class="bi bi-calendar"></i> ${date}
                            </p>
                            <p class="text-muted small mb-0">
                                <i class="bi bi-geo-alt"></i> ${order.deliveryAddress}
                            </p>
                        </div>

                        <!-- Order Items -->
                        <div class="col-md-4">
                            <h6 class="text-muted small fw-bold mb-2">ITEMS</h6>
                            ${order.orderItems ? order.orderItems.map(item =>
                                `<div class="small text-muted">
                                    • ${item.menuItem ? item.menuItem.name : 'Item'} × ${item.quantity}
                                 </div>`
                            ).join('') : '<p class="text-muted small">No items</p>'}
                        </div>

                        <!-- Total & Actions -->
                        <div class="col-md-3 text-end">
                            <div class="price-tag fs-5 mb-3">
                                ₹${order.totalAmount ? order.totalAmount.toFixed(2) : '0.00'}
                            </div>
                            <div class="d-flex flex-column gap-2">
                                <button class="btn btn-hotpot btn-sm"
                                        onclick="trackOrder(${order.id})">
                                    <i class="bi bi-geo-alt"></i> Track
                                </button>
                                ${isCancellable ? `
                                <button class="btn btn-outline-danger btn-sm"
                                        onclick="cancelOrder(${order.id})">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </button>` : ''}
                            </div>
                        </div>
                    </div>
                </div>`;
            list.appendChild(card);
        });
    }

    // ===== Track Order =====
    async function trackOrder(orderId) {
    document.getElementById('trackingOrderId').textContent = 'Order #' + orderId;
    document.getElementById('trackingSteps').innerHTML = `
        <div class="text-center py-3">
            <div class="spinner-border text-warning"></div>
            <p class="mt-2 text-muted">Loading tracking...</p>
        </div>`;

    const modal = new bootstrap.Modal(
        document.getElementById('trackingModal'));
    modal.show();

    try {
        const response = await fetch(
            `${API}/api/tracking/order/${orderId}`,
            { headers: { 'Authorization': 'Bearer ' + token } }
        );

        console.log('Tracking response status:', response.status);

        if (response.ok) {
            const tracking = await response.json();
            console.log('Tracking data:', JSON.stringify(tracking));

            // ✅ Handle both direct status and nested status
            const status = tracking.status
                        || (tracking.order && tracking.order.status)
                        || 'PLACED';

            displayTrackingSteps(status, tracking.message);

        } else if (response.status === 404) {
            // ✅ Tracking not created yet — show PLACED as default
            displayTrackingSteps('PLACED', 'Order placed successfully!');
        } else {
            document.getElementById('trackingSteps').innerHTML =
                '<p class="text-danger text-center">Failed to load tracking!</p>';
        }

    } catch (error) {
        console.error('Tracking error:', error);
        // ✅ Show default PLACED status on error
        displayTrackingSteps('PLACED', 'Order placed successfully!');
    }
}
    function displayTrackingSteps(currentStatus, message) {
        const container = document.getElementById('trackingSteps');
        container.innerHTML = '';

        // ✅ Show current status message at top
        if (message) {
            container.innerHTML += `
                <div class="alert alert-warning mb-3">
                    <i class="bi bi-info-circle"></i> <strong>${message}</strong>
                </div>`;
        }

        const currentIndex = allSteps.findIndex(s => s.key === currentStatus);

        allSteps.forEach((step, index) => {
            let dotClass  = 'pending';
            let textClass = 'text-muted';

            if (index < currentIndex) {
                dotClass  = 'done';
                textClass = '';
            }
            if (index === currentIndex) {
                dotClass  = 'current';
                textClass = '';
            }

            const isLast = index === allSteps.length - 1;

            container.innerHTML += `
                <div class="tracking-step">
                    <div class="d-flex flex-column align-items-center me-3">
                        <div class="tracking-dot ${dotClass}"></div>
                        ${!isLast ? '<div class="tracking-line"></div>' : ''}
                    </div>
                    <div class="pb-3">
                        <div class="fw-bold ${textClass}">
                            ${step.icon} ${step.label}
                        </div>
                        <small class="${
                            index === currentIndex ? 'text-warning fw-bold' :
                            index < currentIndex   ? 'text-success'         :
                                                     'text-muted'
                        }">
                            ${
                                index === currentIndex ? '← You are here' :
                                index < currentIndex   ? 'Completed ✓'    :
                                                         'Pending'
                            }
                        </small>
                    </div>
                </div>`;
        });

        // ✅ If CANCELLED show special message
        if (currentStatus === 'CANCELLED') {
            container.innerHTML = `
                <div class="text-center py-3">
                    <div style="font-size:3rem">❌</div>
                    <h5 class="text-danger mt-2">Order Cancelled</h5>
                    <p class="text-muted">This order has been cancelled.</p>
                </div>`;
        }
    }
    // ===== Cancel Order =====
    async function cancelOrder(orderId) {
        if (!confirm('Are you sure you want to cancel this order?')) return;

        try {
            const response = await fetch(`${API}/api/order/cancel/${orderId}`, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                showAlert('success', 'Order cancelled successfully!');
                loadOrders();
            } else {
                const data = await response.json();
                showAlert('danger', data.message || 'Cannot cancel order!');
            }
        } catch (error) {
            showAlert('danger', 'Server error!');
        }
    }

    // ===== Helper =====
    function getStatusIcon(status) {
        const icons = {
            'PLACED':'📋', 'CONFIRMED':'✅', 'PROCESSING':'👨‍🍳',
            'DISPATCHED':'🚴', 'DELIVERED':'🎉', 'CANCELLED':'❌'
        };
        return icons[status] || '📦';
    }

    function showAlert(type, msg) {
        const el = document.getElementById('alertBox');
        el.className = `alert alert-${type}`;
        el.textContent = msg;
        el.classList.remove('d-none');
        setTimeout(() => el.classList.add('d-none'), 3000);
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
