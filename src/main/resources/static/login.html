
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotPot | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire: #ff6b35;
            --fire-dark: #e85d2f;
            --coal: #1a1a2e;
            --ash: #16213e;
            --cream: #faf7f2;
            --gold: #f5a623;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            background: var(--coal);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ANIMATED BG */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(255,107,53,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(245,166,35,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 80%, rgba(255,107,53,0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        /* FLOATING DOTS */
        .dot {
            position: fixed;
            border-radius: 50%;
            opacity: 0.06;
            animation: floatDot linear infinite;
        }
        @keyframes floatDot {
            0%   { transform: translateY(100vh) scale(0); opacity:0; }
            10%  { opacity: 0.06; }
            90%  { opacity: 0.06; }
            100% { transform: translateY(-100px) scale(1); opacity:0; }
        }

        /* MAIN CARD */
        .login-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 10;
            animation: fadeUp 0.5s ease both;
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(24px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .brand-section {
            text-align: center;
            margin-bottom: 28px;
        }
        .brand-logo {
            font-family: 'Syne', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--fire);
            letter-spacing: -1px;
        }
        .brand-tagline {
            color: rgba(255,255,255,0.35);
            font-size: 0.82rem;
            margin-top: 4px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* ROLE SELECTOR */
        .role-section {
            margin-bottom: 24px;
        }
        .role-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 14px;
        }
        .role-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .role-card {
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .role-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--fire), var(--fire-dark));
            opacity: 0;
            transition: opacity 0.25s;
        }
        .role-card:hover {
            border-color: rgba(255,107,53,0.4);
            transform: translateY(-2px);
        }
        .role-card.selected {
            border-color: var(--fire);
            box-shadow: 0 0 0 3px rgba(255,107,53,0.18), 0 8px 24px rgba(255,107,53,0.2);
        }
        .role-card.selected::before { opacity: 0.12; }

        .role-emoji {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
            transition: transform 0.2s;
        }
        .role-card:hover .role-emoji,
        .role-card.selected .role-emoji { transform: scale(1.15); }

        .role-name {
            font-family: 'Syne', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            position: relative;
            z-index: 1;
            transition: color 0.2s;
        }
        .role-card.selected .role-name { color: #fff; }

        .role-desc {
            font-size: 0.68rem;
            color: rgba(255,255,255,0.3);
            margin-top: 2px;
            position: relative;
            z-index: 1;
        }
        .role-card.selected .role-desc { color: rgba(255,255,255,0.6); }

        .role-check {
            position: absolute;
            top: 8px; right: 8px;
            width: 18px; height: 18px;
            background: var(--fire);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem;
            color: #fff;
            opacity: 0;
            transform: scale(0);
            transition: all 0.2s;
            z-index: 2;
        }
        .role-card.selected .role-check { opacity: 1; transform: scale(1); }

        /* LOGIN FORM CARD */
        .form-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 28px;
            backdrop-filter: blur(10px);
        }

        .selected-role-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,107,53,0.1);
            border: 1px solid rgba(255,107,53,0.2);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 22px;
        }
        .srb-emoji { font-size: 1.2rem; }
        .srb-text  { font-size: 0.84rem; font-weight: 600; color: rgba(255,255,255,0.75); }
        .srb-hint  { font-size: 0.74rem; color: rgba(255,255,255,0.35); }

        .form-group { margin-bottom: 16px; }
        .f-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 7px;
            display: block;
        }
        .f-input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            color: #fff;
            transition: all 0.2s;
            outline: none;
        }
        .f-input::placeholder { color: rgba(255,255,255,0.2); }
        .f-input:focus {
            border-color: var(--fire);
            background: rgba(255,107,53,0.06);
            box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
        }

        /* PASSWORD TOGGLE */
        .pw-wrap { position: relative; }
        .pw-toggle {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer; font-size: 1rem;
            transition: color 0.2s;
        }
        .pw-toggle:hover { color: rgba(255,255,255,0.6); }

        /* LOGIN BUTTON */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--fire), var(--fire-dark));
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255,107,53,0.4);
        }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ALERT */
        .alert-box {
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 0.84rem;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
        }
        .alert-box.show { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
        .alert-danger  { background: rgba(231,76,60,0.15);  border:1px solid rgba(231,76,60,0.3);  color:#ff8a80; }
        .alert-success { background: rgba(46,204,113,0.15); border:1px solid rgba(46,204,113,0.3); color:#69f0ae; }
        .alert-warning { background: rgba(245,166,35,0.15); border:1px solid rgba(245,166,35,0.3); color:#ffd740; }

        /* DIVIDER */
        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 20px 0;
            color: rgba(255,255,255,0.2);
            font-size: 0.78rem;
        }
        .divider::before,.divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.08); }

        /* REGISTER LINK */
        .register-row {
            text-align: center;
            font-size: 0.84rem;
            color: rgba(255,255,255,0.3);
            margin-top: 16px;
        }
        .register-row a {
            color: var(--fire);
            text-decoration: none;
            font-weight: 600;
        }
        .register-row a:hover { text-decoration: underline; }

        /* ROLE COLOR ACCENTS */
        .role-card[data-role="ADMIN"].selected    { border-color: #e74c3c; box-shadow:0 0 0 3px rgba(231,76,60,0.18); }
        .role-card[data-role="ADMIN"].selected .role-check { background: #e74c3c; }
        .role-card[data-role="ADMIN"].selected .srb-banner { border-color: rgba(231,76,60,0.3); }

        .role-card[data-role="RESTAURANT"].selected { border-color: var(--gold); box-shadow:0 0 0 3px rgba(245,166,35,0.18); }
        .role-card[data-role="RESTAURANT"].selected .role-check { background: var(--gold); }

        /* SPINNER */
        .spinner { width:18px; height:18px; border:2.5px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* STEP INDICATOR */
        .steps {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 24px;
        }
        .step-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transition: all 0.3s;
        }
        .step-dot.active { background: var(--fire); width: 24px; border-radius: 4px; }
        .step-dot.done   { background: rgba(255,107,53,0.4); }
    </style>
</head>
<body>

<!-- FLOATING DOTS BG -->
<div class="dot" style="width:80px;height:80px;left:10%;animation-duration:18s;animation-delay:0s;background:var(--fire)"></div>
<div class="dot" style="width:40px;height:40px;left:30%;animation-duration:24s;animation-delay:4s;background:var(--gold)"></div>
<div class="dot" style="width:60px;height:60px;left:60%;animation-duration:20s;animation-delay:8s;background:var(--fire)"></div>
<div class="dot" style="width:30px;height:30px;left:80%;animation-duration:16s;animation-delay:2s;background:var(--gold)"></div>
<div class="dot" style="width:50px;height:50px;left:45%;animation-duration:22s;animation-delay:12s;background:var(--fire)"></div>

<div class="login-wrapper">

    <!-- BRAND -->
    <div class="brand-section">
        <div class="brand-logo">🍲 HotPot</div>
        <div class="brand-tagline">Your Favourite Food, Delivered Hot</div>
    </div>

    <!-- STEP DOTS -->
    <div class="steps">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
    </div>

    <!-- STEP 1: ROLE SELECTION -->
    <div id="step1">
        <div class="role-label">Step 1 — Who are you?</div>
        <div class="role-cards">
            <div class="role-card" data-role="USER" onclick="selectRole('USER', this)">
                <div class="role-check">✓</div>
                <span class="role-emoji">🛍️</span>
                <div class="role-name">Customer</div>
                <div class="role-desc">Order food</div>
            </div>
            <div class="role-card" data-role="RESTAURANT" onclick="selectRole('RESTAURANT', this)">
                <div class="role-check">✓</div>
                <span class="role-emoji">🍽️</span>
                <div class="role-name">Restaurant</div>
                <div class="role-desc">Manage menu</div>
            </div>
            <div class="role-card" data-role="ADMIN" onclick="selectRole('ADMIN', this)">
                <div class="role-check">✓</div>
                <span class="role-emoji">🛡️</span>
                <div class="role-name">Admin</div>
                <div class="role-desc">Full control</div>
            </div>
        </div>
        <div class="text-center mt-3" style="font-size:0.78rem;color:rgba(255,255,255,0.2)">
            Click a role to continue →
        </div>
    </div>

    <!-- STEP 2: LOGIN FORM -->
    <div id="step2" style="display:none">
        <div class="form-card">

            <!-- SELECTED ROLE BANNER -->
            <div class="selected-role-banner" id="roleBanner">
                <div class="srb-emoji" id="bannerEmoji">🛍️</div>
                <div>
                    <div class="srb-text" id="bannerText">Logging in as Customer</div>
                    <div class="srb-hint" id="bannerHint">Enter your credentials below</div>
                </div>
                <button onclick="goBack()" style="margin-left:auto;background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:0.8rem;transition:color 0.2s" onmouseover="this.style.color='rgba(255,255,255,0.7)'" onmouseout="this.style.color='rgba(255,255,255,0.3)'">
                    ← Change
                </button>
            </div>

            <!-- ALERT -->
            <div class="alert-box" id="alertBox"></div>

            <!-- EMAIL -->
            <div class="form-group">
                <label class="f-label">Email Address</label>
                <input type="email" class="f-input" id="email" placeholder="you@example.com" autocomplete="email">
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label class="f-label">Password</label>
                <div class="pw-wrap">
                    <input type="password" class="f-input" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
                    <button class="pw-toggle" onclick="togglePw()" type="button" id="pwToggleBtn">
                        <i class="bi bi-eye" id="pwIcon"></i>
                    </button>
                </div>
            </div>

            <!-- LOGIN BTN -->
            <button class="btn-login" id="loginBtn" onclick="doLogin()">
                <span id="btnText">Login</span>
                <i class="bi bi-arrow-right" id="btnIcon"></i>
            </button>

        </div>

        <!-- REGISTER LINK -->
        <div class="register-row">
            Don't have an account?
            <a href="register.html">Create one →</a>
        </div>
        <div class="register-row mt-2">
            <a href="index.html" style="color:rgba(255,255,255,0.25);font-size:0.78rem">← Back to Home</a>
        </div>
    </div>

</div><!-- /login-wrapper -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = 'http://localhost:8080';
let selectedRole = '';

// Auto-redirect if already logged in
window.onload = function() {
    const token = localStorage.getItem('token');
    const role  = localStorage.getItem('userRole');
    if (token && role) {
        redirectByRole(role);
    }
};

// ROLE SELECTION CONFIG
const roleConfig = {
    USER: {
        emoji: '🛍️',
        text:  'Logging in as Customer',
        hint:  'Browse restaurants, order food, track deliveries',
        redirect: 'restaurants.html'
    },
    RESTAURANT: {
        emoji: '🍽️',
        text:  'Logging in as Restaurant Owner',
        hint:  'Manage menu, view and update orders',
        redirect: 'restaurant-dashboard.html'
    },
    ADMIN: {
        emoji: '🛡️',
        text:  'Logging in as Administrator',
        hint:  'Full system access and management',
        redirect: 'admin-dashboard.html'
    }
};

function selectRole(role, el) {
    selectedRole = role;

    // Update card styles
    document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');

    // Short delay then show step 2
    setTimeout(() => {
        showStep2(role);
    }, 320);
}

function showStep2(role) {
    const cfg = roleConfig[role];

    document.getElementById('bannerEmoji').textContent = cfg.emoji;
    document.getElementById('bannerText').textContent  = cfg.text;
    document.getElementById('bannerHint').textContent  = cfg.hint;

    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';

    // Step dots
    document.getElementById('dot1').classList.remove('active');
    document.getElementById('dot1').classList.add('done');
    document.getElementById('dot2').classList.add('active');

    // Focus email
    setTimeout(() => document.getElementById('email').focus(), 100);
}

function goBack() {
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'block';
    document.getElementById('dot2').classList.remove('active');
    document.getElementById('dot1').classList.remove('done');
    document.getElementById('dot1').classList.add('active');
    document.getElementById('alertBox').classList.remove('show');
    selectedRole = '';
}

function togglePw() {
    const inp  = document.getElementById('password');
    const icon = document.getElementById('pwIcon');
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        inp.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');

    // Validate
    if (!selectedRole) { showAlert('warning', '⚠️ Please select a role first!'); goBack(); return; }
    if (!email)    { showAlert('warning', '⚠️ Please enter your email!'); return; }
    if (!password) { showAlert('warning', '⚠️ Please enter your password!'); return; }

    // Loading state
    btn.disabled = true;
    document.getElementById('btnText').textContent = 'Logging in...';
    document.getElementById('btnIcon').outerHTML   = '<div class="spinner" id="btnIcon"></div>';

    try {
        const res = await fetch(`${API}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        console.log('Login response:', data);

        if (res.ok) {
            // ✅ Get role from response
            const serverRole = data.role || data.userRole || '';

            // ✅ Check role matches selected
            const normalizedServer   = serverRole.replace('ROLE_','').toUpperCase();
            const normalizedSelected = selectedRole.replace('ROLE_','').toUpperCase();

            if (normalizedServer !== normalizedSelected) {
                showAlert('danger', `❌ This account is not a ${selectedRole} account! Please select the correct role.`);
                resetBtn();
                return;
            }

            // ✅ Save to localStorage
            localStorage.setItem('token',       data.token);
            localStorage.setItem('userId',      data.id);
            localStorage.setItem('userName',    data.name   || data.userName || '');
            localStorage.setItem('userEmail',   data.email  || email);
            localStorage.setItem('userRole',    serverRole);

            showAlert('success', `✅ Welcome back, ${data.name || 'User'}! Redirecting...`);

            // ✅ Redirect based on role
            setTimeout(() => redirectByRole(serverRole), 1200);

        } else {
            // Handle errors
            const msg = data.message || 'Invalid email or password!';
            showAlert('danger', '❌ ' + msg);
            resetBtn();
        }

    } catch(e) {
        console.error('Login error:', e);
        showAlert('danger', '❌ Cannot connect to server! Make sure Spring Boot is running.');
        resetBtn();
    }
}

function redirectByRole(role) {
    const normalized = role.replace('ROLE_','').toUpperCase();
    const cfg = roleConfig[normalized];
    if (cfg) {
        window.location.href = cfg.redirect;
    } else {
        // Default fallback
        window.location.href = 'restaurants.html';
    }
}

function resetBtn() {
    const btn = document.getElementById('loginBtn');
    btn.disabled = false;
    document.getElementById('btnText').textContent = 'Login';
    const spinnerEl = document.getElementById('btnIcon');
    if (spinnerEl) spinnerEl.outerHTML = '<i class="bi bi-arrow-right" id="btnIcon"></i>';
}

function showAlert(type, msg) {
    const el = document.getElementById('alertBox');
    el.className = `alert-box alert-${type} show`;
    el.textContent = msg;
    if (type !== 'success') {
        setTimeout(() => el.classList.remove('show'), 4000);
    }
}
</script>
</body>
</html>
