<!DOCTYPE html>
<html>
<head>
    <title>HotPot - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="col-md-4 mx-auto card p-4 shadow">
        <h3 class="text-center mb-3">HotPot Login</h3>

        <div id="errorAlert" class="alert alert-danger d-none"></div>

        <input type="email" id="email" class="form-control mb-3" placeholder="Email">
        <input type="password" id="password" class="form-control mb-3" placeholder="Password">

        <button class="btn btn-warning w-100" onclick="login()">Login</button>

        <p class="text-center mt-3">
            Don't have account?
            <a href="register.html">Register</a>
        </p>
    </div>
</div>

<script>
    const API = "http://localhost:8080";

    async function login() {

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const response = await fetch(API + "/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {

            localStorage.setItem("token", data.token);
            localStorage.setItem("userId",    data.id);
            localStorage.setItem("userName", data.name);

            window.location.href = "index.html";

        } else {
            const errorAlert = document.getElementById("errorAlert");
            errorAlert.classList.remove("d-none");
            errorAlert.innerText = data.message;
        }
    }
</script>

</body>
</html>
