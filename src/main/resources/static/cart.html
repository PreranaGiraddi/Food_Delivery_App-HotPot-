<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotPot - My Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .navbar-brand { color:#ff6b35 !important; font-size:1.8rem; font-weight:700; }
        .btn-hotpot { background-color:#ff6b35; color:white; border:none; border-radius:25px; padding:8px 20px; }
        .btn-hotpot:hover { background-color:#e55a25; color:white; }
        .cart-card { border:none; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.08); }
        .qty-btn { width:32px; height:32px; border-radius:50%; border:2px solid #ff6b35; background:white; color:#ff6b35; font-weight:700; cursor:pointer; font-size:1rem; }
        .qty-btn:hover { background:#ff6b35; color:white; }
        .qty-display { font-weight:700; font-size:1rem; min-width:25px; text-align:center; }
        .price-tag { color:#ff6b35; font-weight:700; }
        .summary-card { border:none; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.08); position:sticky; top:80px; }
        .empty-cart { min-height:400px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        footer { background-color:#2d2d2d; color:#aaa; }
    </style>
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">🍲 HotPot</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="restaurants.html"><i class="bi bi-shop"></i> Restaurants</a></li>
                <li class="nav-item"><a class="nav-link fw-bold" href="cart.html" style="color:#ff6b35"><i class="bi bi-cart3"></i> Cart</a></li>
                <li class="nav-item"><a class="nav-link" href="orders.html"><i class="bi bi-bag-check"></i> My Orders</a></li>
                <li class="nav-item"><span class="nav-link fw-bold text-warning" id="userName"></span></li>
                <li class="nav-item"><button class="btn btn-outline-danger ms-2" onclick="logout()">Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<!-- HEADER -->
<div style="background:linear-gradient(135deg,#ff6b35,#f7c59f); padding:25px 0;">
    <div class="container text-white">
        <h3 class="fw-bold mb-0"><i class="bi bi-cart3"></i> My Cart</h3>
    </div>
</div>

<div class="container py-4">
    <div id="alertBox" class="alert d-none"></div>

    <!-- Loading -->
    <div id="loadingSection" class="text-center py-5">
        <div class="spinner-border text-warning" style="width:3rem;height:3rem;"></div>
        <p class="mt-3 text-muted">Loading cart...</p>
    </div>

    <!-- Empty Cart -->
    <div id="emptyCart" class="d-none">
        <div class="empty-cart text-center">
            <div style="font-size:5rem">🛒</div>
            <h4 class="mt-3 text-muted">Your cart is empty!</h4>
            <p class="text-muted">Add items from restaurants to get started</p>
            <a href="restaurants.html" class="btn btn-hotpot mt-2">
                <i class="bi bi-shop"></i> Browse Restaurants
            </a>
        </div>
    </div>

    <!-- Cart Content -->
    <div id="cartContent" class="d-none">
        <div class="row g-4">

            <!-- Cart Items -->
            <div class="col-lg-8">
                <div class="card cart-card p-3">
                    <div class="card-body">
                        <h5 class="fw-bold mb-4">
                            <i class="bi bi-bag"></i> Cart Items
                            <span class="badge bg-warning text-dark ms-2" id="itemCountBadge"></span>
                        </h5>
                        <div id="cartItemsList"></div>

                        <!-- Clear Cart -->
                        <div class="text-end mt-3">
                            <button class="btn btn-outline-danger btn-sm" onclick="clearCart()">
                                <i class="bi bi-trash"></i> Clear Cart
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Order Summary -->
            <div class="col-lg-4">
                <div class="card summary-card p-3">
                    <div class="card-body">
                        <h5 class="fw-bold mb-4">
                            <i class="bi bi-receipt"></i> Order Summary
                        </h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal</span>
                            <span id="subtotal">₹0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Delivery</span>
                            <span class="text-success">FREE</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fw-bold fs-5">Total</span>
                            <span class="fw-bold fs-5 price-tag" id="totalPrice">₹0</span>
                        </div>
                        <button class="btn btn-hotpot w-100 py-2" onclick="goToCheckout()">
                            <i class="bi bi-bag-check"></i> Proceed to Checkout
                        </button>
                        <a href="restaurants.html" class="btn btn-outline-secondary w-100 mt-2">
                            <i class="bi bi-plus"></i> Add More Items
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">🍲 <strong class="text-white">HotPot</strong> © 2024</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API    = 'http://localhost:8080';
const token  = localStorage.getItem('token');
const userId = localStorage.getItem('userId');
const name   = localStorage.getItem('userName');


window.onload = function () {
    if (!token || !userId) {
        window.location.href = 'login.html';
        return;
    }
    document.getElementById('userName').textContent = '👤 ' + name;
    loadCart();
}


async function loadCart() {

    document.getElementById('loadingSection').classList.remove('d-none');
    document.getElementById('cartContent').classList.add('d-none');
    document.getElementById('emptyCart').classList.add('d-none');
    document.getElementById('cartItemsList').innerHTML = '';

    try {
        const response = await fetch(`${API}/api/cart/${userId}`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });

        const data = await response.json();
        document.getElementById('loadingSection').classList.add('d-none');

  
        if (!data || !data.cartItems || data.cartItems.length === 0) {
            document.getElementById('emptyCart').classList.remove('d-none');
            return;
        }

     
        document.getElementById('cartContent').classList.remove('d-none');
        displayCart(data);

    } catch (error) {
        document.getElementById('loadingSection').classList.add('d-none');
        showAlert('danger', 'Cannot load cart!');
    }
}


function displayCart(cartData) {
    const list  = document.getElementById('cartItemsList');
    list.innerHTML = '';

    const items = cartData.cartItems;


    document.getElementById('itemCountBadge').textContent = items.length + ' items';
    document.getElementById('subtotal').textContent       = '₹' + cartData.totalPrice.toFixed(2);
    document.getElementById('totalPrice').textContent     = '₹' + cartData.totalPrice.toFixed(2);

   
    	items.forEach(item => {
    	    // ✅ Handle BOTH formats
    	    // Format 1 - CartDTO:   item.menuItemId, item.menuItemName
    	    // Format 2 - Entity:    item.menuItem.id, item.menuItem.name

    	    const id    = item.menuItemId    || item.menuItem.id;
    	    const name  = item.menuItemName  || item.menuItem.name;
    	    const price = item.price         || item.menuItem.discountPrice || item.menuItem.price;
    	    const total = item.totalItemPrice;
    	    const qty   = item.quantity;

    	    const div = document.createElement('div');
    	    div.className = 'border-bottom py-3';
    	    div.id = 'item_' + id;

    	    div.innerHTML = `
    	        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
    	            <div class="flex-grow-1">
    	                <h6 class="fw-bold mb-1">${name}</h6>
    	                <small class="text-muted">₹${price} each</small>
    	            </div>
    	            <div class="d-flex align-items-center gap-3">
    	                <button class="qty-btn" onclick="clickMinus(${id})">−</button>
    	                <span class="qty-display" id="qty_${id}">${qty}</span>
    	                <button class="qty-btn" onclick="clickPlus(${id})">+</button>
    	                <span class="price-tag" id="total_${id}">₹${total.toFixed(2)}</span>
    	                <button class="btn btn-outline-danger btn-sm"
    	                        onclick="removeItem(${id})">
    	                    <i class="bi bi-trash"></i>
    	                </button>
    	            </div>
    	        </div>`;

    	    list.appendChild(div);
    	});
}

// ===== Minus Button Clicked =====
function clickMinus(itemId) {
    // Read current qty from screen
    const qtySpan = document.getElementById('qty_' + itemId);
    const currentQty = parseInt(qtySpan.textContent.trim());

    if (currentQty <= 1) {
        // If qty is 1 and minus clicked — ask to remove
        if (confirm('Remove this item from cart?')) {
            removeItem(itemId);
        }
    } else {
        // Reduce by 1
        updateQuantity(itemId, currentQty - 1);
    }
}

// ===== Plus Button Clicked =====
function clickPlus(itemId) {
    // Read current qty from screen
    const qtySpan = document.getElementById('qty_' + itemId);
    const currentQty = parseInt(qtySpan.textContent.trim());

    // Increase by 1
    updateQuantity(itemId, currentQty + 1);
}

// ===== Update Quantity API Call =====
async function updateQuantity(menuItemId, newQty) {
    try {
        const response = await fetch(
            `${API}/api/cart/update?userId=${userId}&menuItemId=${menuItemId}&quantity=${newQty}`,
            {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token }
            }
        );

        if (response.ok) {
            loadCart(); // Reload cart to show updated values
        } else {
            const err = await response.json();
            showAlert('danger', err.message || 'Update failed!');
        }

    } catch (error) {
        showAlert('danger', 'Server error during update!');
    }
}

// ===== Remove Single Item =====
async function removeItem(menuItemId) {
    try {
        const response = await fetch(
            `${API}/api/cart/remove?userId=${userId}&menuItemId=${menuItemId}`,
            {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            }
        );

        if (response.ok) {
            loadCart(); // Reload cart
        } else {
            const err = await response.json();
            showAlert('danger', err.message || 'Remove failed!');
        }

    } catch (error) {
        showAlert('danger', 'Server error during remove!');
    }
}

async function clearCart() {
    if (!confirm('Clear entire cart?')) return;

    try {
        const response = await fetch(`${API}/api/cart/clear/${userId}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (response.ok) {
            // ✅ Add these two lines — clear restaurant tracking
            localStorage.removeItem('cartRestaurantId');
            localStorage.removeItem('cartRestaurantName');

            document.getElementById('cartContent').classList.add('d-none');
            document.getElementById('cartItemsList').innerHTML = '';
            document.getElementById('emptyCart').classList.remove('d-none');
            showAlert('success', 'Cart cleared successfully!');
        } else {
            const err = await response.json();
            showAlert('danger', err.message || 'Clear failed!');
        }
    } catch (error) {
        showAlert('danger', 'Server error during clear!');
    }
}

// ===== Go to Checkout =====
function goToCheckout() {
    const totalText = document.getElementById('totalPrice').textContent;
    const total = parseFloat(totalText.replace('₹', ''));

    if (!total || total <= 0) {
        showAlert('warning', 'Cart is empty! Add items first.');
        return;
    }

    window.location.href = 'checkout.html';
}

// ===== Show Alert =====
function showAlert(type, msg) {
    const el = document.getElementById('alertBox');
    el.className = 'alert alert-' + type;
    el.textContent = msg;
    el.classList.remove('d-none');
    setTimeout(() => el.classList.add('d-none'), 3000);
}

// ===== Logout =====
function logout() {
    localStorage.clear();
    window.location.href = 'index.html';
}
</script>
</body>
</html>
